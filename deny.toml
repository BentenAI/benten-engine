    { id = "RUSTSEC-2024-0411", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (atk); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },
    { id = "RUSTSEC-2024-0412", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (atk-sys); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },
    { id = "RUSTSEC-2024-0413", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (gdk); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },
