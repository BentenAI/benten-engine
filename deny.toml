    { id = "RUSTSEC-2024-0416", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (gdk-sys); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },
    { id = "RUSTSEC-2024-0418", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (gtk); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },
    { id = "RUSTSEC-2024-0419", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (gtk-sys); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },
    { id = "RUSTSEC-2024-0420", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (gtk3-macros); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },
    { id = "RUSTSEC-2024-0429", reason = "transitive via tauri 2.x linux webview -> gtk-rs GTK3 bindings (glib 0.18.5); informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream gtk4-rs migration)" },

    # RUSTSEC-2025-0075..0081 + 0098 + 0100: unic-* crates
    # unmaintained (informational). Transitive via urlpattern ->
    # tauri-utils.
    { id = "RUSTSEC-2025-0075", reason = "transitive via tauri-utils -> urlpattern -> unic-ucd-ident -> unic-* family; informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream urlpattern/unic-ucd successor migration)" },
    { id = "RUSTSEC-2025-0080", reason = "transitive via tauri-utils -> urlpattern -> unic-ucd-* family; informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream urlpattern/unic-ucd successor migration)" },
    { id = "RUSTSEC-2025-0081", reason = "transitive via tauri-utils -> urlpattern -> unic-ucd-* family; informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream urlpattern/unic-ucd successor migration)" },
    { id = "RUSTSEC-2025-0098", reason = "transitive via tauri-utils -> urlpattern -> unic-ucd-* family; informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream urlpattern/unic-ucd successor migration)" },
    { id = "RUSTSEC-2025-0100", reason = "transitive via tauri-utils -> urlpattern -> unic-ucd-* family; informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream urlpattern/unic-ucd successor migration)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 newly-flagged unmaintained (successor to proc-macro-error RUSTSEC-2024-0370, also ignored); transitive via tauri 2.x / gtk-rs proc-macro deps AND via hax-lib-macros (the hax formal-verification macro crate's proc-macro-error2 dep); informational unmaintained, no exploit; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream proc-macro-error2 successor migration)" },

    # RUSTSEC-2026-0194 + RUSTSEC-2026-0195: quick-xml DoS advisories (HIGH
    # 7.5) — DISTINCT CATEGORY from the informational-unmaintained entries
    # above (these are real DoS advisories, suppressed on REACHABILITY, not
    # informational). RUSTSEC-2026-0194 = quadratic-runtime duplicate-attribute;
    # RUSTSEC-2026-0195 = unbounded namespace-declaration allocation. Transitive
    # via tauri 2.11 -> plist 1.9 -> quick-xml 0.39 AND iroh 1.0.0-rc.0 ->
    # netwatch -> netdev -> plist -> quick-xml. quick-xml is reached ONLY for
    # parsing LOCAL OS-generated property lists (macOS Info.plist /
    # network-interface enumeration) — never remote or untrusted-user XML — so
    # the malicious-XML input both advisories require is not reachable on any
    # Benten attack surface. NOT bumpable in isolation: plist pins
    # quick-xml ^0.39.2, so quick-xml >=0.41.0 needs upstream plist/tauri/iroh
    # releases. Closure on the tauri/iroh upstream bump cycle tracked at
    # docs/future/phase-4-backlog.md §3.6. Added 2026-07-02 (Phase-4-Meta-Core
    # R6 round-7); mirror in supply-chain.yml cargo-audit --ignore (§3.5g item 4).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic-runtime duplicate-attribute DoS (HIGH 7.5); transitive via tauri 2.11 -> plist AND iroh 1.0.0-rc.0 -> netdev -> plist -> quick-xml; reachable ONLY for local OS-plist parsing (macOS Info.plist / netdev interface enumeration), never remote/untrusted XML; plist pins quick-xml ^0.39.2 so not bumpable without upstream plist/tauri/iroh release; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri/iroh upstream plist -> quick-xml >=0.41 bump)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml unbounded namespace-declaration allocation DoS (HIGH 7.5); transitive via tauri 2.11 -> plist AND iroh 1.0.0-rc.0 -> netdev -> plist -> quick-xml; reachable ONLY for local OS-plist parsing (macOS Info.plist / netdev interface enumeration), never remote/untrusted XML; plist pins quick-xml ^0.39.2 so not bumpable without upstream plist/tauri/iroh release; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri/iroh upstream plist -> quick-xml >=0.41 bump)" },

    # RUSTSEC-2026-0222: wasmtime "Stores can mix up type indices between
    # engines" (GHSA-hgjw-h833-99q9, CVSS 3.1 AV:L/AC:H/PR:H/UI:R/S:U/C:L/I:L/A:L
    # — LOW). Suppressed on STRUCTURAL UNREACHABILITY, not on severity and not
    # on cost. The advisory's precondition is two or more live `Engine`
    # instances whose `Store`s can be confused; `benten-eval`'s SANDBOX runtime
    # holds a single process-wide `OnceLock<Engine>`
    # (`sandbox::instance::SHARED_ENGINE`) and has exactly one `Engine::new`
    # call site in the whole crate, so there is no second engine to mix indices
    # with. That premise is ENFORCED, not merely asserted, by
    # `crates/benten-eval/tests/exactly_one_wasmtime_engine_per_process.rs` —
    # adding a second construction site fails CI naming the file and line, with
    # the failure message pointing back at this entry.
    # ⚠️ THREE CORRECTIONS 2026-08-13 (rules 14 + 15) — the entry below
    # overstated on one axis, understated on another, and rested on a premise
    # that has since been retracted.
    #
    # (1) "UNREACHABLE" is a SCOPE OVERCLAIM. It is unreachable in our own
    #     binaries, and the `OnceLock` + mutation-proven guard genuinely enforce
    #     that — this is not a false record. But `benten-eval` PUBLICLY EXPORTS
    #     `shared_engine() -> &'static Engine` and
    #     `module_for_bytes() -> Arc<Module>`, which is exactly the material the
    #     advisory says to keep apart. A library consumer holding both can build
    #     the second engine our guard test forbids us from building. The honest
    #     scope is "unreachable in first-party code", not "unreachable".
    # (2) "no patch exists in the pinned 43.x line" UNDERSTATES the situation.
    #     43.x is an EOL non-LTS line receiving NO security backports at all.
    #     VERIFIED against crates.io 2026-08-13: 43.0.2 shipped 2026-04-30 and
    #     the 2026-07-31 coordinated security release shipped 46.0.2 and 47.0.3
    #     — and NOTHING for 43, 44 or 45. The old wording reads "this one fix
    #     missed us"; the truth is "this line is unmaintained." This advisory is
    #     the first symptom, not the problem.
    # (3) The deferral rationale — "belongs in a window where the conformance
    #     lanes can absorb a regression, NOT on the interface-freeze branch" —
    #     rested on the freeze being imminent. Ben retracted that premise
    #     2026-08-13 ("I'm not worried about getting it done at a certain
    #     date"), so the deferral no longer has a stated reason. Re-derived: the
    #     decisive question is not effort but FREEZE-VISIBILITY, and the
    #     freeze-visible item is the public-surface leak in (1) rather than the
    #     version number. See `docs/future/phase-4-backlog.md` §3.6.
    { id = "RUSTSEC-2026-0222", reason = "wasmtime store/type-index confusion between engines (LOW, AV:L/AC:H/PR:H/UI:R); unreachable IN FIRST-PARTY CODE — benten-eval holds ONE process-wide OnceLock<Engine> with exactly one Engine::new site, enforced by crates/benten-eval/tests/exactly_one_wasmtime_engine_per_process.rs; NOT claimed unreachable for library consumers, since shared_engine() and module_for_bytes() are public and a consumer can construct the second engine the guard forbids us; 43.x is an EOL non-LTS line receiving no security backports (43.0.2 = 2026-04-30; the 2026-07-31 drop shipped 46.0.2/47.0.3 and nothing for 43/44/45), so this is the first symptom of an unmaintained line rather than a single missed fix; closure tracked at docs/future/phase-4-backlog.md §3.6" },

    # RUSTSEC-2026-0247 / -0248 / -0251: `bitmaps`, `im`, `sized-chunks`
    # unmaintained advisories (informational — no exploit class; rust-sec flags
    # them because bodil/im-rs is archived). All three arrive as ONE transitive
    # cluster via loro 1.12 -> loro-internal -> im -> {bitmaps, sized-chunks};
    # `im` is loro's persistent-collection dependency, not ours, and Benten has
    # no direct dependency on any of the three. Not separately bumpable: closure
    # requires an upstream loro release that drops or replaces `im`. Tracked at
    # `docs/future/phase-4-backlog.md §3.6` on the loro upstream bump cycle.
    { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained (informational, archived upstream); transitive via loro 1.12 -> loro-internal -> im -> bitmaps; no direct Benten dependency; closure requires an upstream loro release dropping `im`, tracked at docs/future/phase-4-backlog.md §3.6" },
    { id = "RUSTSEC-2026-0248", reason = "im unmaintained (informational, bodil/im-rs archived); transitive via loro 1.12 -> loro-internal -> im; no direct Benten dependency; closure requires an upstream loro release dropping `im`, tracked at docs/future/phase-4-backlog.md §3.6" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks unmaintained (informational, archived upstream); transitive via loro 1.12 -> loro-internal -> im -> sized-chunks; no direct Benten dependency; closure requires an upstream loro release dropping `im`, tracked at docs/future/phase-4-backlog.md §3.6" },

    # ---- ONE ID IS SUPPRESSED IN supply-chain.yml AND DELIBERATELY NOT HERE ----
    # RUSTSEC-2023-0126 (`im` OrdSet aliasing violation) is
    # `informational = "unsound"`. cargo-audit DENIES that class; cargo-deny's
    # version-2 default only WARNS on it, so this file does not need — and must
    # not carry — an ignore entry for it: an id cargo-deny never detects would
    # generate a permanent `advisory-not-detected` warning and train us to skim
    # past those. The §3.5g item-4 dual-config mirror is therefore satisfied by
    # DOCUMENTATION here rather than by a literal duplicate entry; the full
    # rationale (real UB reachable from safe code, no patch, crate archived,
    # loro-1.13.9 bump verified NOT to drop it) lives next to the cargo-audit
    # --ignore in .github/workflows/supply-chain.yml. Do not "fix the mirror" by
    # adding it here without first checking whether cargo-deny's unsound policy
    # has changed.
    #
    # Also NOT here because it was FIXED rather than suppressed:
    # RUSTSEC-2026-0253 (`lru` use-after-free on panic in `pop()`, transitive via
    # iroh-relay) — closed by `cargo update -p lru` 0.18.0 -> 0.18.2.
