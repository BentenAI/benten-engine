    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri 2.x macro stack -> proc-macro-error; informational unmaintained; closure tracked at docs/future/phase-4-backlog.md §3.6 (Tauri upstream proc-macro-error2 migration)" },

