[package]
name = "benten-dsl-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Phase-2b DSL-text → benten_core::Subgraph compiler. MINIMAL-FOR-DEVSERVER scope per arch-pre-r1-1: ~900 LOC, 7 public items (compile_str, compile_file, CompileError, Diagnostic, CompiledSubgraph, CompiledPrimitive, PrimitiveKind re-export). Sibling-of-engine; depends on benten-core only — MUST NOT depend on benten-eval or benten-graph (preserves arch-1)."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
# `bench = false` was set when this crate had zero benchmark coverage
# (#929 finding). Keeping it `false` for the LIBRARY target itself: the
# library's `#[test]` module is the inline-tests carrier, not a bench
# carrier. Dedicated bench harnesses live under `benches/` and are
# wired below via `[[bench]]`.
bench = false

[dependencies]
# Per arch-pre-r1-3 + plan §3.2 G12-B + r1-architect-reviewer.json:
# benten-dsl-compiler depends on benten-core (Subgraph + Value + PrimitiveKind)
# and MUST NOT depend on benten-eval or benten-graph (preserves arch-1).
benten-core = { path = "../benten-core" }
benten-errors = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# #929 closure: regression-detection harness for parse/emit round-trip
# over the 5 MINIMAL-FOR-DEVSERVER fixtures. Catches ~10x slowdown if a
# future grammar extension introduces accidental quadratic complexity.
criterion = { workspace = true }

# #929 closure: single round-trip bench harness. `harness = false` so
# criterion's own runner takes over (criterion convention).
[[bench]]
name = "round_trip"
harness = false
