[package]
name = "benten-drop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Drop bundle format (G-CORE-3f) — self-contained CBOR-on-disk envelope `DropBundle{version, spec_cid, auth_grant, content: Vec<EncryptedNode>, key_material, manifest}` shipped over the iroh-blobs two-CID seam (mode 2 sendme→Drop). Carries Spike G's envelope-sig + per-Node-sig defense-in-depth (<12% overhead); mode 3 inline-tiny deferred to post-v1. Consumer reads filesystem-only (no network, no live publisher)."

[lints]
workspace = true

[lib]
# Disable the implicit libtest bench harness so `cargo bench --workspace`
# passes Criterion CLI flags through. See benten-core/Cargo.toml for the
# longer rationale.
bench = false

# GAP-KDB Shape-B (W2) — the benten-drop Layer-C RED-PHASE pins import the
# `benten_drop::kdb_seal_testing` (+ `benten_id::kdb_testing`) fixtures, which
# live behind the `testing` feature. Marked `required-features` so a feature-less
# `cargo test --workspace` SKIPS them (compile-skip) rather than failing on the
# `use benten_drop::kdb_seal_testing` import. CI runs the workspace with
# `--features …benten-drop/testing…`, so they compile + run there (ignored pins
# skip; the live golden / framing pins run green). un-ignore the RED pins at R5.
[[test]]
name = "kdb_drop1_7_gapkdb_seal_flagship"
required-features = ["testing"]

[[test]]
name = "kdb_drop2_sole_constructor"
required-features = ["testing"]

[[test]]
name = "kdb_drop3_anti_downgrade_grep"
required-features = ["testing"]

[[test]]
name = "kdb_drop4_c9_roster_replacement"
required-features = ["testing"]

[[test]]
name = "kdb_drop5_c8_generation_precedence"
required-features = ["testing"]

[[test]]
name = "kdb_drop6_seal_roundtrip"
required-features = ["testing"]

[[test]]
name = "kdb_drop8_sender_origin_auth"
required-features = ["testing"]

[[test]]
name = "kdb_drop9_group_commitment_golden"
required-features = ["testing"]

[[test]]
name = "kdb_drop10_empty_roster"
required-features = ["testing"]

[[test]]
name = "kdb_drop11_audience_aad_golden"
required-features = ["testing"]

# G-CORE-3f Drop-bundle deps — leans on the substrate cascade:
#   - benten-crypto-suite (3a CANARY) — AeadKeyMaterial + AeadEnvelope + cipher dispatch
#   - benten-graph (3d) — EncryptedNode + per-Node AEAD wrap (the storage-layer
#     content cells the Drop bundle ships as `Vec<EncryptedNode>`)
#   - benten-caps (3b) — RestrictedScope (the SubgraphSpec selector) + AuthorizationGrant
#     (the ONE signed artifact `{ucan, key_material, binding_sig}` carried in the bundle)
#   - benten-core — Cid + canonical-bytes seam (spec_cid + per-Node plaintext_cids)
#   - benten-id — Keypair (test fixtures + Ed25519 envelope signing)
#   - benten-errors — ErrorCode discriminants for the wave's typed mints

# R6 R1 FP-A Bundle F1.b — `testing` feature gates the
# `pub fn .*_for_test*` constructors / helpers / fixtures per
# V1-FROZEN-INTERFACE.md §1. Chains through to sibling crates whose
# `_for_test` items this crate's fixtures (build_5_recipe_bundle_*) +
# tamper / consume helpers transitively call.
[features]
default = []
testing = [
    "benten-caps/testing",
    "benten-id/testing",
    "benten-crypto-suite/testing",
    "benten-core/testing",
]

[dependencies]
benten-core = { path = "../benten-core" }
benten-errors = { workspace = true }
benten-caps = { path = "../benten-caps" }
benten-graph = { path = "../benten-graph" }
benten-crypto-suite = { path = "../benten-crypto-suite" }
benten-id = { path = "../benten-id" }
# F-02 OPTION-(b) (Ben-ratified): benten-drop OWNS the `0x6610` group per-stanza
# 11-field AAD byte-assembly itself (`layer_c::group_posture::assemble_group_aad_local`)
# — there is NO production dependency on `benten-membership-set`. That crate
# carries a PRODUCTION dep on `benten-sync` (→ iroh/loro, native-only), so a
# production edge benten-drop → benten-membership-set would invert the layering
# (drop is a leaf bundle-format crate) AND pull native-only sync into drop's
# wasm/freeze graph. The canonical bytes are IDENTICAL — the local assembler
# reproduces the R0.7 §3.10/§4.1 BLINDED 11-field set byte-for-byte. A TEST-ONLY
# cross-check ([dev-dependencies] below) asserts zero drift against the canonical
# `benten_membership_set::aad::assemble_group_aad` so the two engines stay locked.

# Canonical bytes substrate. DAG-CBOR (the workspace canonical-bytes
# encoding per Phase-1 Cid contract) is the bundle's on-disk format.
# `serde` derives the encode/decode for `DropBundle` + its components;
# `serde_ipld_dagcbor` encodes to canonical DAG-CBOR; `serde_bytes`
# narrows `Vec<u8>` → CBOR byte-string (the standard envelope shape
# used for nonces / ciphertexts / signature bytes across the workspace).
serde = { workspace = true, features = ["derive", "alloc"] }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
thiserror = { workspace = true }

# BLAKE3 keyed/plain hash for the Layer-C `layer_c` module: the BLINDED
# `0x6520` `audience_set_commitment` (IDENTICAL primitive to the
# MembershipSet `0x6610` commitment), the self-describing body-CID digest,
# and the deterministic per-recipient-keypair seed expansion (which routes
# the actual key material through `benten-crypto-suite`, the ONLY crypto
# call site). `default-features = false` — the core hashing API suffices.
blake3 = { workspace = true }

# R11 MC-1: OS CSPRNG for the fresh random `0x6520` group content-encryption-
# key (`OsRng.fill_bytes`). The workspace `rand_core` (0.6, `getrandom` + `std`)
# is the same CSPRNG `benten-crypto-suite` seeds its keygen from — the group
# CEK is now sampled fresh per message rather than derived from public wire
# inputs (Sealed-Sender confidentiality fix).
rand_core = { workspace = true }

# R19 secret-hygiene: zeroize-on-drop for the transient `GroupAadInputs.k_set`
# group-key copy (layer_c). The prior "benten-drop carries no zeroize
# dependency" note in layer_c.rs named exactly this as the deferred future
# hygiene sweep; R19 adopts it. Wire/serialization behavior is unchanged —
# drop-behavior + Debug redaction only.
zeroize = { workspace = true }

# Cryptographic surface for the envelope-level signature (the defense-
# in-depth outer layer per Spike G). Goes through `benten-id` for the
# `Keypair`/`PublicKey` API (which itself routes to ed25519-dalek via
# benten-crypto-suite per the ONLY-call-site rule). The bundle envelope
# is signed with the issuer's Ed25519 keypair; per-Node integrity is
# the secondary layer via the AEAD authentication tags already carried
# in each `EncryptedNode`.

[dev-dependencies]
# `benten-id::keypair::Keypair` is used by the TF-3f pin fixtures
# (`build_5_recipe_bundle_for_*`, `flip_byte_in_content_for_test`,
# `tamper_envelope_signature_for_test`, etc.). Already a regular dep
# above; listed here for clarity that the dev-time pins exercise it.
#
# R4.6-MIGRATE (R0.7 §3.3/§4.1 — `0x6520` group-AAD blinding): the
# `f_lc_hpke` pin's self-contained `layer_c_stub::audience_set_commitment`
# helper computes the BLINDED `audience_set_commitment` via `blake3::hash`
# (the IDENTICAL primitive `benten-membership-set`'s `f_aad_2` `0x6610`
# commitment uses), so the two engines agree byte-for-byte over the same
# roster. Mirrors the workspace pin; `default-features = false` (the core
# `blake3::hash` API needs no default features).
blake3 = { workspace = true }

# F-02 OPTION-(b) TEST-ONLY cross-check: the `f_02_group_aad_11field_and_f_01_truncation`
# test asserts benten-drop's LOCAL 11-field AAD assembler
# (`layer_c::group_posture::assemble_group_aad_local`) reproduces the CANONICAL
# `benten_membership_set::aad::assemble_group_aad` bytes BYTE-FOR-BYTE (zero drift).
# This is the ONLY edge to benten-membership-set and it lives ONLY in the test
# binaries — drop's PRODUCTION tree stays sync-free (cargo tree -e normal proves it).
benten-membership-set = { path = "../benten-membership-set" }

# F-NQC4-1 hybrid did:key wave: the `f_nqc4_1_*` arms decode the base58btc
# `did:key` body to assert the two-registered-component-multikey layout
# (ML-DSA-first) + drive the adversarial corruption pins. Same base58btc
# (multibase `z`) primitive `benten-id::did` uses; TEST-ONLY edge.
bs58 = { workspace = true }
