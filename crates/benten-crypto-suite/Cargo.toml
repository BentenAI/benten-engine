[package]
name = "benten-crypto-suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The ONE thin Benten-owned signature/hash/cipher-suite-agility integration crate — a codepoint-dispatched seam wrapping vetted upstream RustCrypto primitives. v1-beta signature default = hybrid Ed25519⊕ML-DSA-65 (byte-faithful IETF LAMPS composite id-MLDSA65-Ed25519-SHA512; wire mldsaSig || tradSig, NO commitment trailer; both must verify); classical-only Ed25519 = non-default downgrade; typed unsupported-algorithm arm (never silent fallback); no hardcoded sizes (a v1-PRODUCTION-correctness property). The ONLY crypto-primitive call site per crypto-agility-contract:6."

[lints]
workspace = true

# R6 R1 FP-A Bundle F1.b — `testing` feature gates the
# `pub fn .*_for_test*` constructors / helpers / fixtures per
# V1-FROZEN-INTERFACE.md §1 (item 15 + Row D-22 closure). Workspace
# convention pattern matching `benten-core` / `benten-caps` /
# `benten-graph` / `benten-eval`.
[features]
default = []
testing = []

# F-KAT-2 (CE-D2) — forwards libcrux's hax/F*-derived `check-secret-independence`
# compile-time secret-independence check to the ML-KEM-768 impl. When enabled,
# libcrux-ml-kem's secret integers become opaque secret-typed values that lack
# branch/index/non-CT operations, so the crate FAILS TO COMPILE if it would
# leak a secret-dependent timing path — the genuine build-level gate the
# `check-secret-independence` CI step would run.
#
# ⚠️ FLAG-FOR-BEN (2026-06-05; re-verified at =0.0.10 on 2026-07-20): at the
# pinned `libcrux-ml-kem =0.0.10` this feature STILL DOES NOT COMPILE —
# libcrux-ml-kem's `impl_kem_trait!` macro does not propagate the secret-typed
# signatures to its `keygen`/`encaps`/`decaps` trait methods (E0053
# incompatible-type: `expected Secret<u8>, found u8` at
# `libcrux-ml-kem-0.0.10/src/mlkem768.rs`; first reproduced 2026-06-05 at 0.0.9,
# E0053 PERSISTS at 0.0.10, re-verified 2026-07-20 — an UPSTREAM defect,
# independent of Benten's usage). So the runnable CI secret-independence gate is
# NOT honestly wireable at 0.0.10. This feature is kept as the one-flag-away seam
# (and intent record) for when libcrux ships a version that compiles cleanly
# under it; it is NOT enabled by default and is NOT exercised in CI yet. f_kat_2
# pins the REAL assurance that IS available at 0.0.10 (the production impl is the
# verified libcrux; the portable backend is hax/F*-verified constant-time) and
# leaves the CI-gate-specific arm #[ignore]'d with this same flag. Honesty over green.
mlkem-ct-check = ["libcrux-ml-kem/check-secret-independence"]

# G-CORE-2 (#1300) — the integration crate is the ONE crypto-primitive
# call site. We wrap vetted upstream RustCrypto crates; we NEVER fork or
# reimplement primitives. The deps here are the workspace's only direct
# crypto-primitive imports — every other crate calls our typed API
# (or imports primitives via this crate's re-export module).
[dependencies]
# v1-beta DEFAULT classical half of the hybrid signature (NF-4): Ed25519
# via vetted upstream RustCrypto `ed25519-dalek`. Workspace-pinned at
# version 2 with `default-features = false` + `std` + `rand_core` +
# `zeroize` features. Re-exported via [`primitives::ed25519_dalek`] so
# in-flight callers can route through us without breaking source
# compatibility (per the "ONLY call site" rule — direct deps on
# `ed25519-dalek` live HERE; consumers import through us).
ed25519-dalek = { workspace = true }

# v1-beta DEFAULT PQ half of the hybrid signature (NF-4): ML-DSA-65
# (FIPS-204 Category-3) via vetted upstream RustCrypto `ml-dsa`. Direct
# dep lives HERE (the ONLY crypto-primitive call site per
# `crypto-agility-contract:6`). Pinned `^0.1` per
# `.addl/pq-research/landscape-crate-reverify-2026-05-19.md`.
#
# CLOSED-WITH-EVIDENCE (was DISAGREE-WITH-EVIDENCE at G-CORE-2 canary):
# the G-CORE-2 ecosystem fork (iroh-base 0.98.0's `=`-pin on
# `ed25519-dalek 3.0.0-pre.6` blocking `ml-dsa 0.1.0`'s `pkcs8 ^0.11`
# stable requirement) was resolved 2026-05-19 by the Ben-ratified
# (option (c-ii)) iroh 0.98 → 1.0.0-rc.0 bump (G-CORE-2-FP-1). The
# 1.0.0-rc.0 line picks up `ed25519-dalek 3.0.0-pre.7` (uses
# `ed25519 3.0.0` + `pkcs8 0.11.0` stable) — directly compatible
# with `ml-dsa 0.1`. The deferred-live hybrid arm in `sig.rs` is now
# wired through the real `ml_dsa::SigningKey::<MlDsa65>` /
# `VerifyingKey::<MlDsa65>` paths; the previous synthesizer is
# removed. See `.addl/phase-4-meta/iroh-pin-investigation-2026-05-19.md`
# for the 2-LOC migration confirmation. Features: `alloc` (Vec /
# Box / String — needed for the size-touching surfaces) + `rand_core`
# (key generation via `Generate::generate_from_rng` /
# `try_generate_from_rng`) + `getrandom` (lets us call
# `SigningKey::<MlDsa65>::generate()` which routes through `SysRng`
# without needing the workspace's rand_core 0.6 OsRng — ml-dsa
# expects rand_core 0.10's `CryptoRng`, so going via `getrandom`
# sidesteps the version-skew). `pkcs8` feature NOT enabled — the
# Benten wire format uses raw `Encoded` bytes (`encode()` /
# `decode()`) NOT PKCS#8 envelopes.
#
# `zeroize` feature ENABLED (D-74/75/76 secret-hygiene sweep): `ml-dsa`
# gates its `impl ZeroizeOnDrop for SigningKey<P>` (signing.rs:230-231)
# behind `#[cfg(feature = "zeroize")]` — it is NOT unconditional (an
# earlier comment on the slh-dsa dep below wrongly claimed it was). With
# the feature OFF the raw ML-DSA-65 signing-key material (`seed` + the
# expanded `s1`/`s2`/`t0`/`K`/`tr` polynomials) lingered in freed heap on
# drop. Enabling `zeroize` turns on the upstream `ZeroizeOnDrop` so every
# holder of `ml_dsa::SigningKey<MlDsa65>` — `sig::Keypair.pq` and
# `swap_matrix::PurePqKeypairInner.pq_sk` — wipes on drop, reaching R18-C3
# parity with the `slh-dsa` `slh_sk` sibling. This is a pure drop-behavior
# addition: NO wire / serialization / public-API-shape change (the
# `zeroize 1.8.2` in the lockfile already satisfies ml-dsa's `^1.8.1`).
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "rand_core", "getrandom", "zeroize"] }

# NF-1 PQ⊕PQ end-state non-default arm (ML-DSA-65 ⊕ SLH-DSA): G-CORE-3c
# wires the live arm. `slh-dsa 0.2.0-rc.5` pulls `sha2 ^0.11` + `sha3
# ^0.11` transitively. The workspace already has `sha2 0.11` in the
# lockfile (via `ed25519-dalek 3.0.0-pre.7` → `iroh 1.0.0-rc.0`); a
# parallel `sha3 0.11` lockfile entry is acceptable (the integration
# crate continues to depend on `sha3 ^0.10` for the X-Wing combiner +
# hybrid commitment; the additional `sha3 0.11` from slh-dsa is a
# transitive dupe NOT a workspace-pin bump — the no-fork-primitives
# discipline holds because each version is the same vetted upstream
# crate). The NF-1 arm is **STRUCTURALLY NON-DEFAULT** at workspace
# baseline per the C11b safety invariant (the audit-landed-flag in
# `swap_matrix::audit_landed_pure_pq_flag` is `false` until the
# independent NF-2 / C-GM-AUDIT lands). Parameter-set choice: the
# `Sha2_128s` parameter (Cat 1; smallest signatures + fastest sign/verify
# at the conformance-test layer); the NF-1 wire-format-canonical choice
# of Cat-3-equivalent (Sha2_192s) is a G-CORE-9 P-III freeze decision
# (additive-codepoint-discipline means the suite-selector codepoint
# `0x0003` reserves the *suite* not a specific parameter set; the wire
# format can pin Sha2_192s at G-CORE-9 without re-spending the
# codepoint).
# `zeroize` feature enables `SlhDsaSigningKey`'s `ZeroizeOnDrop` (it is
# `#[cfg(feature = "zeroize")]`-gated in slh-dsa — as it likewise is in
# `ml-dsa`, whose `zeroize` feature we now also enable above) so the
# pure-PQ NF-1 arm's `slh_sk` secret is wiped on drop, matching the
# `ml-dsa` `pq_sk` sibling (R18 C3-A memory-hygiene parity; the `zeroize`
# crate is already vendored).
slh-dsa = { version = "0.2.0-rc.5", features = ["zeroize"] }

# `getrandom 0.4` brings the `SysRng` adapter that adapts the OS entropy
# source to `rand_core 0.10`'s `TryCryptoRng` trait. `slh-dsa 0.2.0-rc.5`
# requires `rand_core::CryptoRng` (0.10) for its `SigningKey::new`; the
# workspace's `rand_core 0.6` (via `crypto_common`) doesn't satisfy that
# bound. `UnwrapErr(getrandom::SysRng)` is the upstream's documented
# adaptation pattern (mirrored in `ml_dsa`'s own test suite at
# `encode.rs:115`). G-CORE-3c's pure-PQ NF-1 arm needs this; the v1-beta
# default + classical arms use the existing `ml_dsa::Generate::generate()`
# path (which sidesteps the version-skew per the existing sig.rs note).
getrandom = { version = "0.4", default-features = false, features = ["std", "sys_rng"] }

# Hash seam (CLAUDE.md baked-in #5; hash is PQ-UNAFFECTED — Grover
# quadratic-only). v1 default = BLAKE3 (multihash 0x1e); pre-blessed
# agile fallbacks = SHA-512/256 (multihash 0x1015) + SHA3-256
# (multihash 0x16).
blake3 = { workspace = true }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }

# Encryption-side primitives (G-CORE-3 #1301) — G-CORE-3a CANARY adds
# `x25519-dalek` + `ml-kem` + `chacha20poly1305` + `hkdf` as direct
# deps of THIS crate (the ONLY crypto-primitive call site per
# crypto-agility-contract:6). The vendored ~30-LOC X-Wing-style
# combiner over `ml-kem` + `x25519-dalek` + `sha3` lights up codepoint
# `0x647a` per Spike I + CLAUDE.md baked-in #5. ChaCha20-Poly1305 is
# the bulk AEAD; HKDF-SHA256 is the structural-KDF substrate per
# Spike E Interpretation-B (`derive_step`/`derive_root` with
# `"step"`/`"root"` info-tags for cross-role domain separation).
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "static_secrets", "zeroize"] }
# ML-KEM-768 PRODUCTION impl = Cryspen `libcrux-ml-kem` (the hax/F*-verified
# constant-time impl). Swapped in 2026-06-05 from the in-tree RustCrypto
# `ml-kem 0.2.3` (now a [dev-dependencies] cross-impl-KAT witness only) per
# Ben's "adopt libcrux now, before the tag" ratification. This moves
# Compromise #32 (ML-KEM-768 Decap side-channel / Tempo-SampleNTT-timing)
# from deferred → mitigated-live: libcrux's portable + AVX2 field
# arithmetic / NTT / serialization / generic high-level code is formally
# verified via hax + F* — its headline advantage over RustCrypto.
#
# The swap is BYTE-SAFE (proven by the canary spike at
# `.addl/phase-4-meta/libcrux-canary-spike.md`): for a fixed FIPS-203
# deterministic seed `libcrux-ml-kem 0.0.10` produces byte-identical
# ek(1184)/ct(1088)/dk(2400)/ss(32) vs RustCrypto `ml-kem 0.2.3` and
# cross-decapsulates both directions. Every on-wire ML-KEM-768 byte + every
# frozen golden survives unchanged. `f_kat_1` asserts this cross-impl
# byte-identity continuously (RustCrypto stays a dev-dep witness for it).
#
# API: the FIPS-203 deterministic path
# `mlkem768::generate_key_pair([u8;64])` (the d‖z seed) +
# `mlkem768::encapsulate(&pk, [u8;32])` (the m randomness) +
# `mlkem768::decapsulate(&sk, &ct)` — all caller-supplied randomness. The
# system-RNG source is PRESERVED unchanged (we fill the [u8;64]/[u8;32]
# from the same OS RNG that the prior RustCrypto path used), so the wasm
# randomness story is identical to before.
#
# `default-features = false, features = ["mlkem768"]` = the leanest build
# (drops mlkem512/1024 + std + the `rand` randomized helpers we don't use).
# On wasm32 the portable (formally-verified, constant-time) backend is
# auto-selected (libcrux's build.rs enables simd128 only on aarch64, simd256
# only on x86_64; neither fires on wasm) — `getrandom` is absent from
# libcrux-ml-kem's OWN subtree (this backend takes caller-supplied
# randomness), so the historical libcrux wasm getrandom pain does not recur.
# NOTE (R15 GAP-1): this "absent" scope is the libcrux subtree ONLY — the
# crate as a whole DOES pull `getrandom` at the top level (the `getrandom
# 0.4 sys_rng` dep above + `ml-dsa`'s `getrandom` feature), so a
# `wasm32-unknown-unknown` build of the whole crate is NOT
# getrandom-free and its entropy/getrandom-backend story on that target is
# CI-unexercised (native-only by dep-graph today; see
# `docs/future/phase-3-backlog.md`). Pinned EXACTLY (`=0.0.10`) per the spike's
# maturity caveat (libcrux-ml-kem is pre-0.1; expect API/SemVer churn —
# vendor-lock the audited version; the NF-2 / C-GM-AUDIT covers whichever
# impl is pinned at v1-GM). NOT a crypto-primitive FORK — this is the ONLY
# crypto-primitive call site wrapping a vetted upstream crate per
# CLAUDE.md baked-in #5 / crypto-agility-contract:6.
# BUMP 0.0.9 -> 0.0.10 (Ben-ratified 2026-07-18): clears RUSTSEC-2026-0207 +
# -0208 (libcrux-sha3 SHAKE bugs) + RUSTSEC-2026-0212 (libcrux-secrets CT
# swap/select on aarch64) via the transitive chain (libcrux-sha3 =0.0.10 +
# libcrux-secrets =0.0.6). VERIFIED byte-identical: every FIPS-203/204 KAT +
# X-Wing + DAK + keyset/DID golden reproduces the frozen bytes unchanged
# (0.0.10 is a bugfix-only release on the portable/verified backend Benten
# uses). 0.0.10 pulls bindgen/clang-sys as HOST build-deps — these run on the
# build host, not the wasm target, so the wasm32 required builds are
# unaffected (validated pre-commit).
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom", "rand_core"] }
hkdf = { version = "0.12", default-features = false }

# Layer-A vault DAK derivation (F-VA-2): Argon2id v0x13 (RFC 9106; OWASP
# params) wrapped from the vetted upstream `argon2` crate — the ONLY
# crypto-primitive call site per crypto-agility-contract:6 (never fork the
# password-hash primitive). `alloc` for the in-memory derive buffer.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

# Layer-A in-process at-rest-key memory hygiene (F-VA-4; Compromise #36/#39):
# `secrecy::SecretBox<[u8;32]>` wraps the unlocked K_principal so its Debug
# redacts (never leaks the bytes) + it zeroizes on Drop. Vetted upstream.
secrecy = { version = "0.10" }

# Standard supporting deps.
serde = { workspace = true, features = ["derive", "alloc"] }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
rand_core = { workspace = true }

# G-CORE-2-FP-1 (2026-05-19) — the provisional `ed25519 = "=3.0.0-rc.4"`
# pin (G-CORE-2 closure-marker for the iroh-base 0.98.0 fork) is
# REMOVED. The iroh 0.98 → 1.0.0-rc.0 bump in `benten-engine` +
# `benten-sync` lets cargo select `ed25519-dalek 3.0.0-pre.7` →
# `ed25519 3.0.0` stable → `pkcs8 0.11.0` stable. No further pin
# needed; transitive resolution unifies on the stable chain.

# `tempfile` + `redb` are used by the `sizes` module's `RedbSigHandle`
# (gated `#[cfg(not(target_arch = "wasm32"))]`) for the TF-2 surface-3
# size-touching pin. NOT crypto primitives — `redb` is the
# workspace-standard durable KV (Phase-1 baked-in) and `tempfile` is the
# standard scratch-dir crate used across the workspace. They live under the
# native-only target table (matching the engine pattern): `redb` + `tempfile`
# have no wasm32 target, so this removes the latent footgun of a future wasm
# build pulling them. No live leak today (crypto-suite is native-only by
# dep-graph) — this is defense-in-depth.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }
redb = { workspace = true }

[dev-dependencies]
# RustCrypto `ml-kem 0.2.3` is RETAINED as a TEST-ONLY cross-impl KAT
# witness (NOT a production dep — production ML-KEM-768 is `libcrux-ml-kem`
# above). `f_kat_1` drives BOTH impls from the same FIPS-203 deterministic
# (d, z, m) seed and asserts byte-identical ek/ct/dk/ss + cross-decap — so
# the libcrux swap is held byte-equal to the RustCrypto FIPS-203 reference
# continuously (NQ-C2). `deterministic` lights the `generate_deterministic
# (d, z)` + `encapsulate_deterministic(m)` FIPS-203 paths + re-exports `B32`
# that f_kat_1 needs to match libcrux's seed-driven keygen exactly.
ml-kem = { version = "0.2", default-features = false, features = ["deterministic"] }

# benten-id pulled as a dev-dep so the `discharge::Issue835Discharge`
# `compile_fail` doctest in lib can name `benten_id::did::Did` at
# doctest-compile time — the test verifies that
# `Did::from_string_unchecked` is genuinely unreachable from outside
# `benten-id` (pim-18 SHAPE-not-SUBSTANCE substitution for the
# previous hardcoded-sentinel discharge marker). Compile-time
# witness, NOT a runtime sentinel.
benten-id = { path = "../benten-id" }
