[package]
name = "benten-membership-set"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The 15th workspace crate — the MembershipSet keying primitive (a thin keying-glue Rust engine plugin / mechanism-half per GN-2 §6.1). Frozen Rust-mechanism: the EXACTLY-3 `MembershipSetKind` enum + its codepoint family (0x6600/0x6610/0x6620), the multi-stanza-HPKE keying glue (delegates primitives to benten-crypto-suite, NEVER forks #5), the `members_table` snapshot canonical-CBOR serialization (the AAD-bound keying minimum; NQ-W4), per-Kind cardinality constructors, the 0x6610 group AAD = the BLINDED 11-field set assembly (R0.7 §3.10/§4.1; supersedes the prior 9-tuple framing) → OPAQUE bytes handed to the crypto-suite (m-15 GNC-5; no reverse dep), the Inv-21 fork-tie-break CRDT rule, and the federation recursion-bound (Inv-20 k). Governance / RoleId-semantics / audit / federation / economics are GRAPH (data-half), never inside the sealed Policy. RED-PHASE STUB at R3-W4: scaffolded minimally so the W4 test pins compile green at baseline; G-CORE F-full canary waves fill the real impl."

[lints]
workspace = true

[lib]
# Match the workspace pattern (benten-errors / benten-core): disable the
# implicit libtest bench harness so `cargo bench --workspace` passes
# Criterion CLI flags through without libtest rejecting them.
bench = false

[features]
default = []
# `testing` gates the `pub fn .*_for_test*` constructors / helpers per the
# V1-FROZEN-INTERFACE.md item-15 convention (matches benten-crypto-suite /
# benten-core / benten-caps). Chains to the upstream `testing` features so the
# `--features testing` test build pulls the upstream test-only constructors.
testing = [
    "benten-crypto-suite/testing",
    "benten-id/testing",
    "benten-caps/testing",
    "benten-sync/testing",
]

[dependencies]
# B-1 dependency set (R5 canary — un-commented from the R3-W4 RED-PHASE
# scaffold per R0 §6.1). Every one is UPSTREAM; benten-membership-set is a
# leaf-ish addition — crypto-suite + sync NEVER depend on it (the F-CRATE-2
# no-reverse-edge compile-fence + dependency_edges.rs assert the direction).
#
#   benten-crypto-suite  # HPKE / AEAD / structural-KDF primitives — the ONLY crypto call site (#5)
#   benten-core          # Node / Version-chain / CID
#   benten-caps          # UCAN / grants — RBAC composition
#   benten-id            # DID + DeviceAttestation + RotationLog
#   benten-graph         # audit-sequence + ChangeEvent
#   benten-sync          # B-1 sync substrate — HLC / Loro / MST / Transport (UPSTREAM; this crate DEPENDS ON it)
#
# The membership crate NEVER constructs a crypto primitive directly
# (`sha3::` / `chacha20` / `ml_kem::` / `ml_dsa::` / `x25519_dalek::`): all
# crypto delegates through benten-crypto-suite's typed API (the #5
# ONLY-call-site discipline — `f_crate_1_2`'s grep-defense pins this).
benten-crypto-suite = { path = "../benten-crypto-suite" }
benten-core = { path = "../benten-core" }
benten-caps = { path = "../benten-caps" }
benten-id = { path = "../benten-id" }
benten-graph = { path = "../benten-graph" }
benten-sync = { path = "../benten-sync" }
# benten-errors is the ErrorCode home (the `E_ROLE_STALE_AT_VERIFY` mint at
# F4-031); it is upstream of every benten crate (the shared catalog root).
benten-errors = { path = "../benten-errors" }

# The mechanism-half's own (non-crypto-primitive) glue deps: BLAKE3 keyed-MAC
# / hash (the §3.9 commitment primitive — `blake3::keyed_hash` / `blake3::hash`
# / `blake3::derive_key`, the native keyed-MAC; no hmac/sha2 dep), canonical
# DAG-CBOR (the `members_table` snapshot encoder = NQ-W4 length-injective),
# serde, and zeroize-on-drop for derived key material.
blake3 = { workspace = true, features = ["pure"] }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# R3 consolidation (merged from R3-W5): the W5 RED-PHASE pins (F-AAD-*,
# F-INV21-*, F-HLC-*, F-CRDT-*, F-MST-*, F-GOSSIP-*) carry SELF-CONTAINED
# in-file stub-shims that materialize canonical-CBOR AAD bytes + a
# blake3-backed stub Cid + proptest convergence harnesses. W4's pins use
# the crate's own `scaffold` module (in src/lib.rs) and need NO external
# dev-deps; this block is exactly W5's set so both waves' test targets
# compile green behind `#[ignore]`. The R5 canary replaces the in-file
# shims with the real `benten_membership_set::…` surface.
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
proptest = { workspace = true }
