name: WASM Conformance (wasm32-wasip1)

# Phase 2b G10-A-wasip1 — wasm32-wasip1 SANDBOX adversarial conformance
# fixture suite (per plan §3.1).
#
# This workflow targets the SANDBOX adversarial fixture batch (fuel-trap,
# memory-kill, no-reentrancy, Inv-7 output-limit, Inv-4 nest-depth,
# module-validation rejection, import-set adversarial, NaN
# canonicalization, etc.) under wasm32-wasip1. The G7-B SANDBOX
# implementation owns the fixture content; G10-A-wasip1 owns the build
# harness that runs the fixtures under wasmtime against the
# wasm32-wasip1 build.
#
# Status:
#   - Today: this workflow runs the SANDBOX-related test surface
#     against the NATIVE build under wasmtime install verification +
#     a wasm32-wasip1 compile-check on the SANDBOX-bearing crates so
#     drift in the SANDBOX path that would break the wasm32-wasip1
#     target fires here at PR time.
#   - When G7-B + G7-C land per-fixture wasm modules under
#     `crates/benten-eval/tests/sandbox-fixtures/*.wat`, this
#     workflow gains a wasmtime-driven step (per-fixture wasi
#     execution + typed-error assertion) running each ESC-1..16
#     fixture through wasmtime and asserting the expected
#     typed error. (Phase-1 compromise #4 regression test scans
#     workflow files for adjacent `cargo test` and the wasi target
#     name on the SAME line — keep any future comment using both
#     tokens split across separate lines to avoid the false
#     positive in this Phase-2b workflow.)
#
# Distinct from `wasm-runtime.yml` (canonical CID + lib smoke) and
# `wasm-browser.yml` (wasm32-unknown-unknown bundle).
#
# Trigger discipline per METH-13: pull_request branches: [main] +
# push branches: [main] + workflow_dispatch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wasm-conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WASMTIME_VERSION: "v26.0.1"
  # Disk-pressure mitigation; see ci.yml env block for rationale.
  # SANDBOX-adversarial fixture job hit `ld signal 7 (SIGBUS)` 2×
  # consecutively on PR #1312 — same x86_64-Linux-disk-OOM root cause
  # class as the cargo-llvm-cov + linux-x86_64 stable failures (ld
  # mmap-truncation when intermediate temp dir runs out of disk).
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  sandbox-wasm-conformance:
    name: SANDBOX adversarial fixture suite — wasm32-wasip1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Free disk space (Linux runners only)
        # infra-disk-pressure-fix-2026-05-22: SANDBOX adversarial native-run
        # step compiles the full benten-eval test surface; without freeing
        # ~25-30 GB of unused tooling first, the ld step hits SIGBUS
        # (mmap-truncation when intermediate temp dir runs out of disk).
        # Composite action mirrors ci.yml + coverage.yml usage.
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain (stable + wasm32-wasip1)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-nextest
        # Required so the SANDBOX adversarial native-run step picks up the
        # `serial-globals` test-group config in `.config/nextest.toml`.
        # The 2 globals-touching tests (`sandbox_module_cache_avoids_recompilation_on_repeated_call`
        # + `wait_signal_shape_defaults_untyped_accepts_any_value`) flake
        # under cargo test's default in-binary parallelism.
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4 # v2
        with:
          tool: cargo-nextest

      - name: Install wasmtime ${{ env.WASMTIME_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            -o /tmp/wasmtime.tar.xz
          mkdir -p /tmp/wasmtime
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp/wasmtime --strip-components=1
          sudo install -m 0755 /tmp/wasmtime/wasmtime /usr/local/bin/wasmtime
          wasmtime --version

      - name: SANDBOX wasm32-wasip1 compile gate (drift detector)
        # Compile the SANDBOX-bearing benten-eval test surface against
        # wasm32-wasip1. Any native-only dep slipping into the SANDBOX
        # path breaks the wasm-target promise; we want this to fire at
        # PR time, not at release time.
        run: cargo check --target wasm32-wasip1 -p benten-eval

      - name: SANDBOX adversarial native run (ESC-1..16 fixture suite)
        # Per the plan §3 G10-A-wasip1 row, this workflow also runs the
        # adversarial SANDBOX fixture suite to prove fuel-trap, memory-
        # kill, no-reentrancy, Inv-7 output-limit, Inv-4 nest-depth,
        # module-validation rejection, import-set adversarial, NaN
        # canonicalization. The full fixture binaries land alongside
        # G7-B's SANDBOX implementation; until they ship per-target,
        # we run the SANDBOX-flavored test surface natively as the
        # initial gate.
        #
        # Uses `cargo nextest run --profile ci` (rather than `cargo test`)
        # so the `serial-globals` test-group config in
        # `.config/nextest.toml` is honored — without it,
        # `sandbox_module_cache_avoids_recompilation_on_repeated_call`
        # races on the global wasmtime Module cache under in-binary
        # parallelism. The ci.yml matrix already uses nextest; this
        # workflow was the outlier.
        run: |
          set -euo pipefail
          cargo nextest run --profile ci -p benten-eval --tests --no-fail-fast --features benten-eval/testing 2>&1 | tee sandbox-conformance.log
          echo "::group::Conformance log tail"
          tail -n 100 sandbox-conformance.log || true
          echo "::endgroup::"

      - name: Configure wasmtime as wasm32-wasip1 test runner
        # Mirrors the configuration used by `wasm-runtime.yml` so the
        # subsequent `cargo test --target wasm32-wasip1` step routes its
        # built test binaries through the locally-installed wasmtime
        # rather than failing for lack of a runner.
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'CARGO_CFG'
          [target.wasm32-wasip1]
          runner = "wasmtime --dir=."
          CARGO_CFG

      - name: SANDBOX wasm32-wasip1 lib-test smoke (Compromise #4 must-invoke)
        # Wave-8e durable fix: the `compromise_4_wasm_runtime_is_phase_2`
        # regression test now positively asserts that this workflow
        # contains a `cargo test ... wasm32-wasip1` invocation. The
        # adversarial-run step above runs natively; this step pins the
        # wasi-target gate by running the benten-core lib tests under
        # wasmtime — small, fast, and proves the workflow is exercising
        # the actual wasi runtime path (not just compile-checking it).
        # When the full per-target adversarial fixture binaries land,
        # this step is the natural carrier to extend.
        run: cargo test --target wasm32-wasip1 -p benten-core --lib -- --nocapture

  crypto-suite-wasm-roundtrip:
    # F-full R6 R1 finding F-06 (Ben-ratified: add the gate). The
    # PQ-hybrid crypto round-trip (tf3a) is one of the three first-class
    # deployment shapes per CLAUDE.md baked-in #17 (thin compute / wasm32
    # BrowserBackend); the encryption layer MUST work end-to-end through
    # the wasm32 target. Before this job the `sandbox-wasm-conformance`
    # job above covered wasm32-wasip1 SANDBOX only (Phase-2b scope) and
    # did NOT exercise the encryption layer — this job closes that gap so
    # the V1-WIRE-FORMAT-INVENTORY.md item 4 wasm32 round-trip claim is
    # CI-gated, not aspirational.
    name: Crypto-suite PQ-hybrid round-trip — wasm32-wasip1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Toolchain-pin discipline: the repo-root rust-toolchain.toml is
      # channel=stable, which SHADOWS the dtolnay action's per-job channel.
      # Pin RUSTUP_TOOLCHAIN explicitly so the wasm32 build is deterministic
      # regardless of the root file (per the F-06 toolchain-shadow note).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Free disk space (Linux runners only)
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain (stable + wasm32-wasip1)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install wasmtime ${{ env.WASMTIME_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            -o /tmp/wasmtime.tar.xz
          mkdir -p /tmp/wasmtime
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp/wasmtime --strip-components=1
          sudo install -m 0755 /tmp/wasmtime/wasmtime /usr/local/bin/wasmtime
          wasmtime --version

      - name: Crypto-suite wasm32-wasip1 compile gate (drift detector)
        # Any native-only dep slipping into the encryption path breaks the
        # wasm-target promise; fire at PR time, not at release time.
        run: cargo check --target wasm32-wasip1 -p benten-crypto-suite

      - name: Configure wasmtime as wasm32-wasip1 test runner
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'CARGO_CFG'
          [target.wasm32-wasip1]
          runner = "wasmtime --dir=."
          CARGO_CFG

      - name: PQ-hybrid envelope round-trip under wasm32-wasip1 (tf3a)
        # Runs the tf3a PQ-hybrid wrap/unwrap round-trip test built for
        # wasm32-wasip1 through the locally-installed wasmtime runner. The
        # `testing` feature is required for the cipher-suite test-only key
        # generation helpers. Scoped to the tf3a round-trip test (the
        # wasm32 encryption-layer pin) so the native-only `_for_test`
        # swap-matrix helpers in the tf4 suite are not pulled into the
        # wasm build.
        run: |
          set -euo pipefail
          cargo test --target wasm32-wasip1 -p benten-crypto-suite \
            --features benten-crypto-suite/testing \
            --test tf3a_pq_hybrid_wasm32_roundtrip -- --nocapture
