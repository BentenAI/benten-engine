# Branch-protection spec drift detector.
#
# Reads `.github/branch-protection.yml`, validates it against itself and the
# workflow tree, then fetches live protection state and diffs the two.
#
# F-015 RESHAPE (R6 round #1, 2026-07-27). Before this, the whole workflow
# could not fail:
#
#   * `STRICT_PROTECTION_CHECK_DEFAULT: 'false'` meant every drift was a
#     warning;
#   * with no PAT the live fetch degraded to diffing `{}`, producing a drift
#     signal indistinguishable from real drift and therefore unactionable —
#     alarm fatigue by construction;
#   * the workflow was not itself a required context, so nothing obliged
#     anyone to look.
#
# The fix separates what needs a PAT from what does not, because conflating
# them is what made the whole thing advisory:
#
#   Job 1 `spec-self-consistency` — needs NO PAT, HARD-FAILS. Everything
#     checkable about the spec without reading live state: contexts resolve to
#     real jobs, those jobs actually run on pull requests, required and pending
#     sets are disjoint, pending entries explain themselves. This is a real
#     gate on every PR and is in the required set.
#
#   Job 2 `spec-self-consistency-self-test` — proves job 1 still detects. Same
#     idiom as `drift-detect.yml`'s already-required "self-test (meta-assertion
#     that the detector actually detects)". A validator nobody falsifies is a
#     validator nobody can trust: the R6 falsification sweep found 17 of 36
#     enforcement claims unenforced precisely because passing was mistaken for
#     enforcing.
#
#   Job 3 `drift-check` — needs a PAT. Stays advisory until one is configured,
#     but no longer manufactures a fake drift number when it cannot see live
#     state. It reports NOT-VERIFIED, which is the truth.
#
# Toggling strict mode for job 3 (after the live state is applied):
#   Option A — flip the env-var below to `true`.
#   Option B — set repo Variable `STRICT_PROTECTION_CHECK=true` in
#              Settings → Secrets and variables → Actions → Variables.

name: Branch Protection Spec Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily catch — picks up out-of-band changes Ben might make in the
    # web UI. Off-peak.
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # NOTE: GitHub's GITHUB_TOKEN cannot read branch-protection settings — the
  # `administration` permission key does not exist for GITHUB_TOKEN. Live
  # drift-check therefore requires a PAT at
  # `secrets.BRANCH_PROTECTION_READ_TOKEN` with `repo` scope (or fine-grained
  # "Administration: read"). Job 1 deliberately depends on none of that.

env:
  # Governs job 3 ONLY. Jobs 1 and 2 are unconditional hard gates — a flag that
  # can switch a check off is a flag that will be found switched off.
  STRICT_PROTECTION_CHECK_DEFAULT: 'false'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — PAT-free, hard-fail. The floor that F-015 says must exist.
  # ---------------------------------------------------------------------------
  spec-self-consistency:
    name: branch-protection spec self-consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Validate spec against itself and the workflow tree
        # MUTATION THAT MUST MAKE THIS FAIL: add any of
        #   - "no such job"                    (phantom context)
        #   - "workspace benches (nightly)"    (schedule-only job)
        #   - a second copy of an existing entry (duplicate)
        # to `protection.required_status_checks.contexts` in
        # `.github/branch-protection.yml`. Each is exercised for real by the
        # self-test job below.
        run: python3 .github/scripts/validate-branch-protection-spec.py .github/branch-protection.yml

  # ---------------------------------------------------------------------------
  # Job 2 — meta-assertion. Mirrors drift-detect.yml's required self-test.
  # ---------------------------------------------------------------------------
  spec-self-consistency-self-test:
    name: branch-protection spec self-consistency self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Assert the validator rejects each known-bad spec
        shell: bash
        run: |
          set -uo pipefail

          expect_reject() {
            local label="$1" spec="$2"
            if python3 .github/scripts/validate-branch-protection-spec.py "$spec" > /tmp/out.txt 2>&1; then
              echo "::error::SELF-TEST FAILED — validator ACCEPTED a spec it must reject: $label"
              cat /tmp/out.txt
              return 1
            fi
            echo "  ok — rejected: $label"
            return 0
          }

          fails=0

          # (a) phantom context: matches no job `name:` anywhere. A required
          #     context that never reports blocks every PR forever.
          python3 - <<'PY'
          import shutil
          shutil.copyfile(".github/branch-protection.yml", "/tmp/m-phantom.yml")
          text = open("/tmp/m-phantom.yml").read().replace(
              '      - "Cargo.lock integrity"',
              '      - "Cargo.lock integrity"\n      - "spec self-test phantom context"',
              1,
          )
          open("/tmp/m-phantom.yml", "w").write(text)
          PY
          expect_reject "phantom context" /tmp/m-phantom.yml || fails=$((fails+1))

          # (b) schedule-only job promoted. `workspace benches (nightly)` is
          #     gated behind `if: github.event_name == 'schedule' || ...` so it
          #     never reports on a PR. This is the #12/C3 footgun.
          python3 - <<'PY'
          import shutil
          shutil.copyfile(".github/branch-protection.yml", "/tmp/m-schedule.yml")
          text = open("/tmp/m-schedule.yml").read().replace(
              '      - "Cargo.lock integrity"',
              '      - "Cargo.lock integrity"\n      - "workspace benches (nightly)"',
              1,
          )
          open("/tmp/m-schedule.yml", "w").write(text)
          PY
          expect_reject "schedule-only job promoted to required" /tmp/m-schedule.yml || fails=$((fails+1))

          # (c) duplicate context.
          python3 - <<'PY'
          import shutil
          shutil.copyfile(".github/branch-protection.yml", "/tmp/m-dupe.yml")
          text = open("/tmp/m-dupe.yml").read().replace(
              '      - "Cargo.lock integrity"',
              '      - "Cargo.lock integrity"\n      - "Cargo.lock integrity"',
              1,
          )
          open("/tmp/m-dupe.yml", "w").write(text)
          PY
          expect_reject "duplicate required context" /tmp/m-dupe.yml || fails=$((fails+1))

          # (d) a pending_promotion entry ALSO listed as required — i.e. someone
          #     promoted a known-unenforceable stub without removing its
          #     blocker. This is CE-02 / C5 recurring.
          python3 - <<'PY'
          import shutil, yaml
          shutil.copyfile(".github/branch-protection.yml", "/tmp/m-both.yml")
          spec = yaml.safe_load(open("/tmp/m-both.yml"))
          first = spec["pending_promotion"][0]["context"]
          text = open("/tmp/m-both.yml").read().replace(
              '      - "Cargo.lock integrity"',
              f'      - "Cargo.lock integrity"\n      - "{first}"',
              1,
          )
          open("/tmp/m-both.yml", "w").write(text)
          PY
          expect_reject "pending context also marked required" /tmp/m-both.yml || fails=$((fails+1))

          # (e) a pending entry with its `blocker:` stripped — ambition with no
          #     stated reason is how a stub quietly becomes a candidate again.
          python3 - <<'PY'
          import yaml
          spec = yaml.safe_load(open(".github/branch-protection.yml"))
          spec["pending_promotion"][0]["blocker"] = ""
          yaml.safe_dump(spec, open("/tmp/m-noblocker.yml", "w"))
          PY
          expect_reject "pending entry with empty blocker" /tmp/m-noblocker.yml || fails=$((fails+1))

          # And the control: the REAL spec must pass. Without this arm a
          # validator that rejects everything would score a perfect self-test.
          if ! python3 .github/scripts/validate-branch-protection-spec.py .github/branch-protection.yml; then
            echo "::error::SELF-TEST FAILED — validator rejects the real, unmutated spec."
            fails=$((fails+1))
          else
            echo "  ok — accepted: the real spec"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "::error::$fails self-test arm(s) failed. The spec validator is no longer detecting what it claims to detect."
            exit 1
          fi
          echo "PASSED: validator rejected all 5 known-bad specs and accepted the real one."

  # ---------------------------------------------------------------------------
  # Job 3 — live diff. Needs a PAT; advisory until one exists AND strict is on.
  # ---------------------------------------------------------------------------
  drift-check:
    name: Compare live branch-protection vs. spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: spec-self-consistency

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve strict-mode flag
        id: strict
        run: |
          flag="${{ vars.STRICT_PROTECTION_CHECK }}"
          if [ -z "$flag" ]; then
            flag="${STRICT_PROTECTION_CHECK_DEFAULT}"
          fi
          echo "strict=$flag" >> "$GITHUB_OUTPUT"
          echo "strict-mode = $flag"

      - name: Install yq
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Fetch live protection state
        id: live
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN || secrets.GITHUB_TOKEN }}
          PAT_CONFIGURED: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN != '' }}
        run: |
          set +e
          live_json="$(gh api /repos/${{ github.repository }}/branches/main/protection 2>&1)"
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            if echo "$live_json" | grep -q "Branch not protected"; then
              echo "live_state=unprotected" >> "$GITHUB_OUTPUT"
              echo '{}' > live.json
            elif echo "$live_json" | grep -q "Resource not accessible"; then
              echo "live_state=skipped_no_pat" >> "$GITHUB_OUTPUT"
              # Deliberately NOT writing '{}' — a synthetic empty live state
              # made the diff below report drift against every context, a
              # number that meant "we cannot see" but read as "everything is
              # wrong". The diff step now skips entirely in this state.
              if [ "$PAT_CONFIGURED" = "true" ]; then
                echo "::error::PAT configured at BRANCH_PROTECTION_READ_TOKEN but still got 403 — token may lack 'repo' scope or 'Administration: read'. Re-issue with the right scope."
                exit 1
              fi
              echo "::warning::Live drift-check NOT VERIFIED — no PAT at secrets.BRANCH_PROTECTION_READ_TOKEN. The spec self-consistency gate above still ran and is a hard gate. See the header of .github/branch-protection.yml to enable live diffing."
            else
              echo "::error::Failed to fetch live protection: $live_json"
              exit 1
            fi
          else
            echo "live_state=protected" >> "$GITHUB_OUTPUT"
            echo "$live_json" > live.json
          fi

      - name: Extract spec
        if: steps.live.outputs.live_state != 'skipped_no_pat'
        run: |
          # `.protection` only — `pending_promotion` is documentation, not part
          # of the branch-protection API payload.
          yq -o=json '.protection' .github/branch-protection.yml > spec.json
          echo "--- spec.json (first 40 lines) ---"
          head -40 spec.json

      - name: Diff live vs spec (key fields)
        id: diff
        if: steps.live.outputs.live_state != 'skipped_no_pat'
        run: |
          set +e

          drift=0
          report=""

          compare() {
            local label="$1"
            local jq_expr="$2"
            local live_v spec_v
            live_v="$(jq -c "$jq_expr // null" live.json 2>/dev/null)"
            spec_v="$(jq -c "$jq_expr // null" spec.json 2>/dev/null)"
            if [ "$live_v" != "$spec_v" ]; then
              report="${report}"$'\n'"- ${label}: live=${live_v} spec=${spec_v}"
              drift=1
            fi
          }

          if [ "${{ steps.live.outputs.live_state }}" = "unprotected" ]; then
            report="- Branch is UNPROTECTED on the live repo. Spec exists but has not been applied. Run the apply runbook documented at the top of .github/branch-protection.yml."
            drift=1
          else
            live_ctx="$(jq -c '.required_status_checks.contexts // [] | sort' live.json)"
            spec_ctx="$(jq -c '.required_status_checks.contexts // [] | sort' spec.json)"
            if [ "$live_ctx" != "$spec_ctx" ]; then
              report="${report}"$'\n'"- required_status_checks.contexts: live=${live_ctx} spec=${spec_ctx}"
              drift=1
            fi

            compare "required_status_checks.strict" '.required_status_checks.strict'
            compare "required_pull_request_reviews.required_approving_review_count" \
                    '.required_pull_request_reviews.required_approving_review_count'
            compare "required_conversation_resolution" '.required_conversation_resolution.enabled // .required_conversation_resolution'
            compare "required_linear_history" '.required_linear_history.enabled // .required_linear_history'
            compare "allow_force_pushes" '.allow_force_pushes.enabled // .allow_force_pushes'
            compare "allow_deletions" '.allow_deletions.enabled // .allow_deletions'
            compare "enforce_admins" '.enforce_admins.enabled // .enforce_admins'
            compare "required_signatures" '.required_signatures.enabled // .required_signatures'
          fi

          echo "drift=$drift" >> "$GITHUB_OUTPUT"

          if [ $drift -eq 0 ]; then
            echo ":white_check_mark: Live branch-protection matches spec." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Branch-protection drift detected"
              echo ""
              echo "Live state at \`main\` does not match \`.github/branch-protection.yml\`."
              echo ""
              echo "### Diff"
              echo "\`\`\`"
              echo "$report"
              echo "\`\`\`"
              echo ""
              echo "Strict mode: \`${{ steps.strict.outputs.strict }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$report"
          fi

      - name: Decide outcome
        run: |
          state="${{ steps.live.outputs.live_state }}"
          drift="${{ steps.diff.outputs.drift }}"
          strict="${{ steps.strict.outputs.strict }}"

          if [ "$state" = "skipped_no_pat" ]; then
            echo "Live diff NOT VERIFIED (no PAT). Spec self-consistency gate passed."
            echo "NOT-VERIFIED is reported as such, never as a drift count." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$drift" = "0" ]; then
            echo "No drift. PASS."
            exit 0
          fi

          if [ "$strict" = "true" ]; then
            echo "::error::Branch-protection drift detected and STRICT_PROTECTION_CHECK is true. FAILING."
            exit 1
          fi

          echo "::warning::Branch-protection drift detected. STRICT_PROTECTION_CHECK is false (warn-only). Apply the spec via the runbook in .github/branch-protection.yml, then flip the strict flag."
          exit 0
