# R4 triage (m14) — standalone MSRV workflow.
#
# CI runs the main workflow on stable; this workflow runs separately on MSRV
# to catch accidental use of newer language features before they reach a user.
#
# Effective MSRV is 1.95 as of Phase 2b wave-8e:
# Bump rationale (1.91 → 1.95): the `Duration::from_mins` and
# `Duration::from_hours` constructors stabilised in Rust 1.95, which
# allows dropping the `#[allow(unknown_lints, clippy::duration_suboptimal_units)]`
# directives planted across the capability-policy / wallclock-refresh /
# subscribe-persist test + bench fleet during Phase 2b waves 5-7. The
# bump also drops the broken 1.85 leg of the determinism T5 matrix per
# det-r4b-7 (the leg has been failing on `wasmtime` and `redb 4` since
# 2026 anyway; 1.91 was always the real floor).
#
# Bump-path history:
#   1.85 → 1.89 (Phase 2a, redb 4.0.0 declared `rust-version = "1.89"`)
#   1.89 → 1.91 (Phase 2b G7-A, wasmtime 43.0.1 declared `rust-version = "1.91"`
#                — the 40 → 43 bump cleared 11 RUSTSEC-2026-008{5..9}/009{1..6}
#                wasmtime advisories from the 2026-04-09 drop)
#   1.91 → 1.95 (Phase 2b wave-8e — `Duration::from_mins`/`from_hours` stab)
#
# Also verifies the canonical fixture CID remains stable at MSRV — the cheap
# determinism gate from docs/archive/spikes/SPIKE-phase-1-stack-RESULTS.md.

name: msrv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # §3.5o CI disk-OOM env discipline (codified 2026-05-22; sweep
  # applied workspace-wide at R6-FP-D 2026-05-24 per L19-r1-MAJ-1
  # close). Prevents `No space left on device` / `ld signal 7 SIGBUS`
  # under cargo compile/link pressure on GH Actions runners.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build-and-fixture-check:
    name: cargo build --workspace --locked @1.95
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # F-060. THE WHOLE POINT OF THIS WORKFLOW LIVES ON THIS LINE.
      #
      # dtolnay/rust-toolchain sets the rustup DEFAULT. The repo-root
      # `rust-toolchain.toml` declares `channel = "stable"`, and rustup ranks a
      # toolchain file above the default — so the bare `cargo build` below ran
      # on floating stable and this job has never tested MSRV since it landed.
      # `RUSTUP_TOOLCHAIN` outranks the file. Same idiom `wasm-conformance.yml`
      # and `wasm-browser.yml` already document for the identical shadow.
      #
      # Keep in lock-step with the `toolchain:` input below and with
      # `workspace.package.rust-version` in Cargo.toml.
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install MSRV toolchain
        # Canonical install idiom — replaces the manual `rustup toolchain
        # install ... && rustup default ...` that was a form drift with
        # the rest of the workflow fleet. NOTE: this action's `toolchain:`
        # input only sets the rustup DEFAULT, which rust-toolchain.toml
        # overrides; the `RUSTUP_TOOLCHAIN` job env above is what actually
        # selects 1.95 for the cargo invocations. Both must stay in sync.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master (no semver tags; Dependabot rotates frequently)
        with:
          toolchain: "1.95"

      - name: Assert the MSRV toolchain is actually in effect
        # F-060 falsification pin. Without this, a dropped/typo'd
        # RUSTUP_TOOLCHAIN silently reverts the job to floating stable and the
        # board stays green — which is exactly how the gate stayed broken.
        #
        # MUTATION THAT MUST MAKE THIS FAIL: delete the `RUSTUP_TOOLCHAIN`
        # line from the job `env:` above. rust-toolchain.toml then wins,
        # `cargo --version` reports the floating-stable version, and this step
        # exits 1.
        run: |
          set -euo pipefail
          actual="$(cargo --version)"
          echo "$actual"
          case "$actual" in
            *" 1.95."*) echo "OK: MSRV 1.95 toolchain is in effect." ;;
            *) echo "::error::MSRV gate is not testing MSRV — expected cargo 1.95.x, got: $actual"; exit 1 ;;
          esac

      - name: Build workspace
        # G11-A Wave 2a: `benten-engine/test-helpers` pairs with
        # `benten-eval/testing` so the test-only surfaces (envelope cache,
        # `backend_for_test`, `testing_force_reregister_with_different_cid`,
        # bloom / Inv-13 matrix hooks) stay available for the MSRV build —
        # the `test-helpers` default was flipped off to keep release
        # builds clean.
        run: cargo build --workspace --locked --features benten-eval/testing,benten-engine/test-helpers,benten-graph/testing,benten-caps/testing,benten-core/testing,benten-id/testing,benten-crypto-suite/testing,benten-drop/testing,benten-ivm/testing,benten-platform-foundation/testing,benten-sync/testing,benten-membership-set/testing,benten-dev/testing

      - name: Fixture-match check (canonical CID)
        run: |
          # The canonical fixture CID must remain stable across Rust versions.
          # If MSRV drift changes the encoding path, this catches it before
          # merge.
          #
          # Scoped to `-p benten-engine --test integration` (the test target
          # containing `exit_6_canonical_cid_matches_spike_fixture`) instead
          # of `--workspace`. Wave-8e disk-pressure investigation: under
          # MSRV 1.95 the workspace-wide test build links 100+ binaries each
          # statically pulling wasmtime + cranelift, blowing the GH Actions
          # runner's 14GB disk and producing `ld: SIGBUS` / `No space left
          # on device` failures during the link step. Building only the one
          # test binary that contains the fixture check eliminates 95% of
          # the linker work without losing coverage.
          # NOTE: `-p benten-engine` package-scoped — feature paths must be
          # reachable from benten-engine's direct deps. benten-drop/testing +
          # benten-dev/testing stripped at PR #1351 (A's F1.c extension was
          # workspace-shaped; package-scope invocations need the narrower list).
          cargo test -p benten-engine --test integration --locked --no-fail-fast --features benten-eval/testing,benten-engine/test-helpers,benten-graph/testing,benten-caps/testing,benten-core/testing,benten-id/testing,benten-crypto-suite/testing,benten-ivm/testing,benten-platform-foundation/testing,benten-sync/testing -- \
            exit_6_canonical_cid_matches_spike_fixture
