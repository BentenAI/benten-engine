name: Determinism

# Cross-target determinism matrix: reproduces the canonical CID fixture on
# every supported target and asserts byte-for-byte equality across legs.
# Owned by rust-test-writer-performance (R3). CI harnesses T4 (multi-arch),
# T5 (MSRV), T6 (wasm-runtime), T9 (cross-leg gate).
#
# Each job prints its observed CID to a build artifact. The final `gate`
# job downloads every artifact and asserts they are all byte-identical —
# per implementation plan §4.6 and R2 landscape §7.4:
#
#   > Cross-leg determinism gate (T9): a CI job that depends on T4 + T5 +
#   > T6 all completing, collects the CID each produced, and asserts they
#   > are byte-for-byte equal — not just "each matches a fixture string"
#   > but "each leg produces the same bytes as every other leg." Failure
#   > message identifies the drift leg and the divergent bytes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # §3.5o CI disk-OOM env discipline (codified 2026-05-22; sweep
  # applied workspace-wide at R6-FP-D 2026-05-24 per L19-r1-MAJ-1
  # close). Prevents `No space left on device` / `ld signal 7 SIGBUS`
  # under cargo compile/link pressure on GH Actions runners.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------------------
  # T4 — Multi-arch native matrix. Each leg reproduces the canonical CID
  # and uploads it for the T9 cross-leg gate.
  # ---------------------------------------------------------------------------
  multi-arch:
    name: T4 multi-arch ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     target: aarch64-apple-darwin,       leg: macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin,      leg: macos-x86_64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu,   leg: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, leg: linux-arm64 }
          - { os: windows-2022, target: x86_64-pc-windows-msvc,     leg: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Reproduce canonical CID
        # Prints the CID to stdout; we redirect to a file for upload.
        # The example is defined in crates/benten-core/examples/print_canonical_cid.rs.
        shell: bash
        run: |
          cargo run --release -p benten-core --example print_canonical_cid --target ${{ matrix.target }} > cid-${{ matrix.leg }}.txt
          cat cid-${{ matrix.leg }}.txt

      - name: Assert fixture match
        shell: bash
        run: |
          recorded=$(tr -d '[:space:]' < crates/benten-core/tests/fixtures/canonical_cid.txt)
          observed=$(tr -d '[:space:]' < cid-${{ matrix.leg }}.txt)
          if [ "$recorded" != "$observed" ]; then
            echo "DRIFT on ${{ matrix.leg }}: fixture=$recorded observed=$observed"
            exit 1
          fi
          echo "OK on ${{ matrix.leg }}: $observed"

      - name: Upload CID artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cid-${{ matrix.leg }}
          path: cid-${{ matrix.leg }}.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # T5 — MSRV (1.95) and latest stable, both reproducing the fixture.
  # The 1.85 leg was dropped per det-r4b-7 + wave-8e: the workspace floor
  # is 1.95 (wasmtime 43 + redb 4 + Duration::from_mins/from_hours stab),
  # so the prior 1.85 cell could never have been green.
  # ---------------------------------------------------------------------------
  msrv:
    name: T5 msrv ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95", "stable"]
    env:
      # F-060. LOAD-BEARING FOR THIS JOB'S ENTIRE CLAIM. The repo-root
      # rust-toolchain.toml (`channel = "stable"`) outranks the rustup default
      # the dtolnay action sets, so BOTH legs ran on floating stable and the
      # T5 cross-toolchain canonical-CID stability assertion compared a
      # toolchain against itself. RUSTUP_TOOLCHAIN outranks the file.
      # The matrix value `1.95` is a rustup version-channel spec and resolves
      # to the 1.95.x the action installed.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master (no semver tags; Dependabot rotates frequently)
        with:
          toolchain: ${{ matrix.rust }}

      - name: Assert the pinned toolchain is actually in effect
        # F-060 falsification pin. Two legs that silently share one compiler
        # cannot detect cross-toolchain drift, which is the only thing T5
        # exists to detect.
        #
        # MUTATION THAT MUST MAKE THIS FAIL: delete the `RUSTUP_TOOLCHAIN`
        # line from the job `env:` -> the 1.95 leg reports the stable version
        # -> this step exits 1.
        run: |
          set -euo pipefail
          actual="$(cargo --version)"
          echo "leg=${{ matrix.rust }} -> $actual"
          if [ "${{ matrix.rust }}" != "stable" ]; then
            case "$actual" in
              *" 1.95."*) echo "OK: MSRV 1.95 toolchain is in effect." ;;
              *) echo "::error::T5 msrv leg is not on 1.95 — got: $actual"; exit 1 ;;
            esac
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Reproduce canonical CID
        run: |
          cargo run --release -p benten-core --example print_canonical_cid > cid-msrv-${{ matrix.rust }}.txt
          cat cid-msrv-${{ matrix.rust }}.txt

      - name: Assert fixture match
        run: |
          recorded=$(tr -d '[:space:]' < crates/benten-core/tests/fixtures/canonical_cid.txt)
          observed=$(tr -d '[:space:]' < cid-msrv-${{ matrix.rust }}.txt)
          if [ "$recorded" != "$observed" ]; then
            echo "DRIFT on msrv=${{ matrix.rust }}: fixture=$recorded observed=$observed"
            exit 1
          fi

      - name: Upload CID artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cid-msrv-${{ matrix.rust }}
          path: cid-msrv-${{ matrix.rust }}.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # T6 — wasm32-wasip1 runtime via wasmtime. Upgrades the prior
  # compile-check to a full runtime CID assertion.
  # ---------------------------------------------------------------------------
  wasm-runtime:
    name: T6 wasm32-wasip1 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain (stable + wasm32-wasip1)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: "latest"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build print_canonical_cid for wasm32-wasip1
        # The example compiles to a single .wasm binary; wasmtime runs it
        # and stdout is the CID.
        run: |
          cargo build --release --target wasm32-wasip1 -p benten-core --example print_canonical_cid

      - name: Run under wasmtime and capture CID
        run: |
          wasmtime target/wasm32-wasip1/release/examples/print_canonical_cid.wasm > cid-wasm32-wasip1.txt
          cat cid-wasm32-wasip1.txt

      - name: Assert fixture match (phrased per plan §2.8 T6)
        # `Node::cid()?.to_string() == <fixture>` as the assertion shape so
        # the test survives the C4 `cid`-crate migration without edit.
        run: |
          recorded=$(tr -d '[:space:]' < crates/benten-core/tests/fixtures/canonical_cid.txt)
          observed=$(tr -d '[:space:]' < cid-wasm32-wasip1.txt)
          if [ "$recorded" != "$observed" ]; then
            echo "DRIFT on wasm32-wasip1: fixture=$recorded observed=$observed"
            exit 1
          fi

      - name: Upload CID artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cid-wasm32-wasip1
          path: cid-wasm32-wasip1.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # T9 — Cross-leg determinism gate. Depends on T4+T5+T6. Asserts EVERY
  # leg produces the same bytes as every other leg. Catches drift that a
  # per-leg fixture match would miss (e.g., if the fixture itself drifted
  # at commit time, per-leg matches would pass silently).
  # ---------------------------------------------------------------------------
  cross-leg-gate:
    name: T9 cross-leg byte-equality gate
    needs: [multi-arch, msrv, wasm-runtime]
    # S-4 (CI-integrity audit 2026-07-26). Same shape as ci.yml's
    # `cross-leg-determinism`: without `if: always()` this REQUIRED context is
    # SKIPPED when any T4/T5/T6 leg dies, and GitHub reports a skipped job to
    # branch protection as SUCCESS. This gate happened to run on the r9-base
    # freeze base only because all 8 of its legs passed there.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # First step after checkout so an already-red upstream costs seconds,
      # not the 25-minute budget.
      - name: Assert every upstream job succeeded
        uses: ./.github/actions/assert-needs-succeeded
        with:
          needs-json: ${{ toJSON(needs) }}

      - name: Download all CID artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: cids/

      - name: Assert byte-for-byte equality across all legs
        shell: bash
        run: |
          set -euo pipefail
          # Collect every CID into a single space-separated list, one per leg.
          shopt -s nullglob
          declare -A legs
          for dir in cids/cid-*; do
            leg=$(basename "$dir" | sed 's/^cid-//')
            # Each artifact dir contains a single .txt file.
            file=$(find "$dir" -type f -name '*.txt' | head -n 1)
            if [ -z "$file" ]; then
              # Mirrors ci.yml's sibling gate: name the failure rather than
              # dying on a bare redirect error two lines later.
              echo "MISSING CID: artifact directory $dir contains no .txt file."
              exit 1
            fi
            value=$(tr -d '[:space:]' < "$file")
            legs[$leg]="$value"
          done

          echo "Legs observed (${#legs[@]}):"
          for leg in "${!legs[@]}"; do
            printf '  %-24s %s\n' "$leg" "${legs[$leg]}"
          done

          # A missing artifact silently drops a leg, which would weaken the
          # cross-leg gate without failing it — catch that degenerate case.
          #
          # S-5 (CI-integrity audit 2026-07-26): this floor was `-lt 5` while
          # the matrix produces 8, so three legs could vanish unnoticed. The
          # count is now exact and derived from this workflow's own matrices,
          # so any change to the leg set is a deliberate, reviewed edit:
          #
          #   multi-arch   5  (macos-arm64, macos-x86_64, linux-x86_64,
          #                    linux-arm64, windows-x86_64)
          #   msrv         2  (msrv-1.95, msrv-stable)
          #   wasm-runtime 1  (wasm32-wasip1)
          #               ---
          #   EXPECTED     8
          #
          # Confirmed against the live run 29879772849, which logged
          # "Legs observed (8)".
          EXPECTED_LEGS=8
          if [ "${#legs[@]}" -ne "$EXPECTED_LEGS" ]; then
            echo "LEG-COUNT FLOOR FAILED: expected exactly ${EXPECTED_LEGS} legs, observed ${#legs[@]}."
            echo "Either an upload step failed silently, or the job matrix changed"
            echo "without updating EXPECTED_LEGS above. Both must be deliberate."
            exit 1
          fi

          # Pick any leg as the reference; every other leg must match its
          # bytes exactly.
          reference_leg=""
          reference_value=""
          for leg in "${!legs[@]}"; do
            reference_leg="$leg"
            reference_value="${legs[$leg]}"
            break
          done

          drift=0
          for leg in "${!legs[@]}"; do
            if [ "${legs[$leg]}" != "$reference_value" ]; then
              echo "DRIFT: $leg produced ${legs[$leg]}, reference $reference_leg produced $reference_value"
              drift=1
            fi
          done

          if [ $drift -ne 0 ]; then
            echo "T9 CROSS-LEG DETERMINISM GATE FAILED — see above for the diverging leg(s)."
            exit 1
          fi

          echo "T9 OK: all $(echo "${!legs[@]}" | wc -w) legs produced the same CID: $reference_value"
