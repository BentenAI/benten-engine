name: ts-public-api (TS API drift detector)

# G-CORE-9 V1-FROZEN-INTERFACE row 2 / item 10 (#1204 TS-side public-API
# parity gate). Per V1-FROZEN-INTERFACE-BUILD-BACKLOG.md row 2: built +
# committed + FREEZE-FLIPPED at G-CORE-9. JS analog of the
# `cargo-public-api` workflow at `.github/workflows/cargo-public-api.yml`.
#
# Trigger discipline: pull_request branches: [main] + push branches:
# [main] + workflow_dispatch.
#
# Status (R6-FP-D 2026-05-24; supersedes prior informational-only
# posture per R6 R1 L17-MINOR-1 close): REQUIRED-FAILING. The freeze
# contract at V1-FROZEN-INTERFACE.md item 10 + the §"Verification
# mechanism (workspace-wide)" preamble (lines 73-80) name this gate as
# backstop #2 alongside cargo-public-api as a structural CI-failing
# defense. Mirrors the cargo-public-api FREEZE-FLIP shape (G-CORE-9 R1
# Fork 3 ratification): drift = workflow fails; baseline-update is the
# explicit fix-path (and must accompany the PR that introduces the
# surface change). Branch-protection spec
# `.github/branch-protection.yml` updated in the same R6-FP-D commit to
# add `TS API drift detector (required-failing per G-CORE-9 FREEZE)`
# to the required-status-checks list; live branch-protection PATCH
# command in the R6-FP-D commit body for orchestrator/Ben to apply.
#
# Implementation is a whole-.d.ts-text structural diff against
# `packages/engine/etc/public-api.txt`, with comments stripped by the
# TypeScript compiler (`--removeComments`). Hardened at the
# CI-integrity pass (S-2): the prior shape grepped only
# `^(export |declare )` opening lines, so class methods + interface
# members + multi-line signatures were invisible to this gate.
# Migration to `@microsoft/api-extractor` (richer structural diff per
# the build-backlog recommendation) is a v1-Composing window
# enhancement — the seam is the workflow itself + the baseline-file
# location.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-public-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # §3.5o CI disk-OOM env discipline (codified 2026-05-22; sweep
  # applied workspace-wide at R6-FP-D 2026-05-24 per L19-r1-MAJ-1
  # close). The Rust toolchain step below + the napi build invoke
  # cargo; without these env vars the GH Actions runner can hit
  # `No space left on device` / `ld signal 7 SIGBUS` during link.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ts-public-api:
    name: TS API drift detector (required-failing per G-CORE-9 FREEZE)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0   # need full history for main..HEAD diff

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 9

      - name: Install Rust stable (for napi build)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable; sets up rustc for the napi build step below
        with:
          toolchain: stable

      - name: Install workspace deps
        # NOTE: --no-frozen-lockfile because pnpm-lock.yaml is NOT
        # checked in (verified via `git log --all -- pnpm-lock.yaml`
        # returning empty). At PR #1351 R6 R1 FP integration fix-up #6
        # discovered Agent D's R6-FP-D ts-public-api workflow ship
        # assumed a committed lockfile that doesn't exist. Functionally
        # equivalent for the baseline-regen + diff this workflow performs.
        run: pnpm install --no-frozen-lockfile

      - name: Build @benten/engine TypeScript
        run: pnpm --filter @benten/engine build

      - name: Regenerate baseline (against fresh build)
        # S-2 close (CI-integrity pass): the prior shape grepped
        # `^(export |declare )` out of the shipped dist/*.d.ts, which
        # recorded declaration OPENING lines only. Class methods,
        # interface members and multi-line signature continuations are
        # indented, so they never matched: `export declare class Engine {`
        # was the ENTIRE frozen record of that class (849 emitted lines,
        # 3 captured; 372 of 5798 emitted lines captured overall).
        #
        # New shape: whole emitted .d.ts text, with comments stripped by
        # the TypeScript compiler itself. Comment-stripping is done by
        # tsc (--removeComments), NOT by regex, because a regex stripper
        # corrupts string-literal types containing comment-like bytes and
        # this package has many (errors.generated CATALOG_CODES is a
        # 189-element string-literal union).
        #
        # This emits declarations ONLY, into a temp dir, so the shipped
        # packages/engine/dist build (which intentionally KEEPS its JSDoc
        # for consumer DX) is untouched. Cost is ~3.5s.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p packages/engine/etc

          # Resolve tsc without depending on pnpm exec workspace context.
          TSC="packages/engine/node_modules/.bin/tsc"
          if [ ! -x "$TSC" ]; then TSC="node_modules/.bin/tsc"; fi
          if [ ! -x "$TSC" ]; then
            echo "::error::tsc not found at packages/engine/node_modules/.bin/tsc or node_modules/.bin/tsc"
            exit 1
          fi

          # Declaration-emit FORMATTING is not a TypeScript stability
          # guarantee, and CI installs with --no-frozen-lockfile against
          # "typescript": "^5.6.0", so it resolves to the latest 5.x at run
          # time. Logging the version makes a baseline churn caused by a
          # toolchain bump immediately legible instead of being mistaken for
          # API drift.
          echo "tsc version: $("$TSC" --version)"

          DTS_DIR="$(mktemp -d)"
          trap 'rm -rf "$DTS_DIR"' EXIT

          # --emitDeclarationOnly : no .js noise (verified byte-identical
          #                         .d.ts to a full emit)
          # --removeComments      : compiler-lexer comment strip
          # --declarationMap/--sourceMap false : no .map files and no
          #                         trailing `//# sourceMappingURL=` pragma
          #                         (that pragma also lacks a trailing
          #                         newline, which would corrupt concatenation)
          "$TSC" -p packages/engine/tsconfig.json \
            --emitDeclarationOnly \
            --removeComments \
            --declarationMap false \
            --sourceMap false \
            --outDir "$DTS_DIR"

          # `--removeComments` also strips `/// <reference ... />` directives,
          # which would make an ambient type dependency invisible to the
          # baseline. Zero exist today; this pins that fact so introducing one
          # becomes a deliberate, reviewed act rather than a silent hole.
          if grep -rqs '^///' "$DTS_DIR" --include='*.d.ts'; then
            echo "::error::A /// <reference> directive appeared in emitted .d.ts. --removeComments strips these, so the baseline cannot record it. Review the ambient type dependency before proceeding."
            exit 1
          fi

          {
            echo '# @benten/engine TypeScript Public API Baseline'
            echo '#'
            echo '# Generated at G-CORE-9 V1-FROZEN-INTERFACE row 2 (2026-05-23).'
            echo '#'
            echo '# This baseline captures the FULL declaration text of the public TS API'
            echo '# at the v1-beta freeze. The ts-public-api workflow diffs this file'
            echo '# against a fresh rebuild on every PR; any drift = baseline-update'
            echo '# PR + manifest-review per V1-FROZEN-INTERFACE.md item 10 contract.'
            echo '#'
            echo '# CAPTURE SHAPE (hardened at the CI-integrity pass; supersedes the'
            echo '# prior grep-openers shape): the whole emitted .d.ts text per file,'
            echo '# with comments stripped by the TypeScript compiler itself'
            echo '# (--removeComments) so a doc-only edit does not churn the baseline.'
            echo '# The prior shape grepped only lines matching ^(export |declare ),'
            echo '# which recorded declaration OPENING lines only -- class methods,'
            echo '# interface members and multi-line signatures were all invisible, so'
            echo '# "export declare class Engine {" was the entire frozen record of that'
            echo '# class (849 emitted lines, 3 captured).'
            echo '#'
            echo '# Determinism: the file list is sorted under LC_ALL=C; within a file'
            echo '# the emit order of the compiler is preserved (the text is brace-'
            echo '# structured and cannot be line-sorted). No timestamps, no absolute'
            echo '# paths, no source maps.'
            echo '#'
            echo '# Per V1-FROZEN-INTERFACE-BUILD-BACKLOG.md row 2 the long-term path is'
            echo '# @microsoft/api-extractor (richer structural diff); this shape is the'
            echo '# structural backstop until then.'
            echo ''
            # Recursive find (psf-2, R6 round-7): covers the publicly-exported
            # `internal/trace.d.ts` subpath, not just top-level files. LC_ALL=C
            # makes the file order locale-independent. Subshell so the `cd`
            # does not leak into the enclosing redirect.
            ( cd "$DTS_DIR" && find . -name '*.d.ts' | LC_ALL=C sort | while IFS= read -r f; do
                rel="${f#./}"
                echo "## $rel"
                cat "$rel"
                echo ""
              done )
          } > packages/engine/etc/public-api.txt.regen

      - name: Diff regenerated vs committed baseline (required-failing per V1-FROZEN-INTERFACE item 10)
        # R6-FP-D 2026-05-24 (L17-MINOR-1 close): flip from
        # informational-only to required-failing. Uses the same
        # tempfile-DRIFT_FLAG_FILE pattern as
        # cargo-public-api.yml R2-FP-1 to avoid the subshell-loses-var
        # trap that bit the cargo-public-api gate at G-CORE-9 R2.
        shell: bash
        run: |
          set -o pipefail
          DRIFT_FLAG_FILE="$(mktemp)"
          trap 'rm -f "$DRIFT_FLAG_FILE"' EXIT
          {
            echo '## ts-public-api drift report'
            echo
            echo '```diff'
            if ! diff -u packages/engine/etc/public-api.txt packages/engine/etc/public-api.txt.regen; then
              echo "1" > "$DRIFT_FLAG_FILE"
            fi
            echo '```'
            echo
            echo "If the diff is non-empty: review the change. If intentional"
            echo "(new public API export, type signature change), update the"
            echo "committed baseline in the same PR + flag the addition for"
            echo "manifest-review per V1-FROZEN-INTERFACE.md item 10 contract."
            echo "If unintentional, revert the source change."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s "$DRIFT_FLAG_FILE" ]; then
            echo "::error::ts-public-api drift detected. Update packages/engine/etc/public-api.txt baseline per the V1-FROZEN-INTERFACE item 10 freeze contract."
            exit 1
          fi
