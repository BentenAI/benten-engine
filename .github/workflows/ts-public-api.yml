name: ts-public-api (TS API drift detector)

# G-CORE-9 V1-FROZEN-INTERFACE row 2 / item 10 (#1204 TS-side public-API
# parity gate). Per V1-FROZEN-INTERFACE-BUILD-BACKLOG.md row 2: built +
# committed + FREEZE-FLIPPED at G-CORE-9. JS analog of the
# `cargo-public-api` workflow at `.github/workflows/cargo-public-api.yml`.
#
# Trigger discipline: pull_request branches: [main] + push branches:
# [main] + workflow_dispatch.
#
# Status (R6-FP-D 2026-05-24; supersedes prior informational-only
# posture per R6 R1 L17-MINOR-1 close): REQUIRED-FAILING. The freeze
# contract at V1-FROZEN-INTERFACE.md item 10 + the §"Verification
# mechanism (workspace-wide)" preamble (lines 73-80) name this gate as
# backstop #2 alongside cargo-public-api as a structural CI-failing
# defense. Mirrors the cargo-public-api FREEZE-FLIP shape (G-CORE-9 R1
# Fork 3 ratification): drift = workflow fails; baseline-update is the
# explicit fix-path (and must accompany the PR that introduces the
# surface change). Branch-protection spec
# `.github/branch-protection.yml` updated in the same R6-FP-D commit to
# add `TS API drift detector (required-failing per G-CORE-9 FREEZE)`
# to the required-status-checks list; live branch-protection PATCH
# command in the R6-FP-D commit body for orchestrator/Ben to apply.
#
# Initial implementation uses an extract-from-.d.ts structural diff
# against `packages/engine/etc/public-api.txt`. Migration to
# `@microsoft/api-extractor` (richer structural diff per the
# build-backlog recommendation) is a v1-Composing window enhancement
# — the seam is the workflow itself + the baseline-file location.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-public-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # §3.5o CI disk-OOM env discipline (codified 2026-05-22; sweep
  # applied workspace-wide at R6-FP-D 2026-05-24 per L19-r1-MAJ-1
  # close). The Rust toolchain step below + the napi build invoke
  # cargo; without these env vars the GH Actions runner can hit
  # `No space left on device` / `ld signal 7 SIGBUS` during link.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ts-public-api:
    name: TS API drift detector (required-failing per G-CORE-9 FREEZE)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0   # need full history for main..HEAD diff

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 9

      - name: Install Rust stable (for napi build)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable; sets up rustc for the napi build step below
        with:
          toolchain: stable

      - name: Install workspace deps
        # NOTE: --no-frozen-lockfile because pnpm-lock.yaml is NOT
        # checked in (verified via `git log --all -- pnpm-lock.yaml`
        # returning empty). At PR #1351 R6 R1 FP integration fix-up #6
        # discovered Agent D's R6-FP-D ts-public-api workflow ship
        # assumed a committed lockfile that doesn't exist. Functionally
        # equivalent for the baseline-regen + diff this workflow performs.
        run: pnpm install --no-frozen-lockfile

      - name: Build @benten/engine TypeScript
        run: pnpm --filter @benten/engine build

      - name: Regenerate baseline (against fresh build)
        # Same shape as the baseline-author script; the diff against the
        # committed baseline file is the drift signal.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p packages/engine/etc
          {
            echo "# @benten/engine TypeScript Public API Baseline"
            echo "#"
            echo "# Generated at G-CORE-9 V1-FROZEN-INTERFACE row 2 (2026-05-23)."
            echo "#"
            echo "# This baseline captures the structural shape of the public TS API"
            echo "# at the v1-beta freeze. The ts-public-api workflow diffs this file"
            echo "# against a fresh rebuild on every PR; any drift = baseline-update"
            echo "# PR + manifest-review per V1-FROZEN-INTERFACE.md item 10 contract."
            echo "#"
            echo "# Per V1-FROZEN-INTERFACE-BUILD-BACKLOG.md row 2 the long-term path"
            echo "# is @microsoft/api-extractor (richer structural diff); this initial"
            echo "# baseline uses extract-exports-from-.d.ts as a simpler structural"
            echo "# backstop that catches add/remove of exports + obvious signature"
            echo "# changes. api-extractor migration is a v1-Composing window enhancement."
            echo ""
            # psf-2 (R6 round-7): glob is RECURSIVE (`dist/**/*.d.ts`) so the
            # publicly-exported `dist/internal/trace.d.ts` subpath (exported
            # via package.json `./internal/trace`) is COVERED — a top-level-
            # only `dist/*.d.ts` glob missed it, so a signature change there
            # would not trip this required-failing parity gate. The `## `
            # header is the path RELATIVE TO dist/ (so nested files are
            # unambiguous; top-level headers are byte-identical to before).
            for f in $(find packages/engine/dist -name '*.d.ts' | sort); do
              rel="${f#packages/engine/dist/}"
              echo "## $rel"
              grep -E "^(export |declare )" "$f" | sort -u
              echo ""
            done
          } > packages/engine/etc/public-api.txt.regen

      - name: Diff regenerated vs committed baseline (required-failing per V1-FROZEN-INTERFACE item 10)
        # R6-FP-D 2026-05-24 (L17-MINOR-1 close): flip from
        # informational-only to required-failing. Uses the same
        # tempfile-DRIFT_FLAG_FILE pattern as
        # cargo-public-api.yml R2-FP-1 to avoid the subshell-loses-var
        # trap that bit the cargo-public-api gate at G-CORE-9 R2.
        shell: bash
        run: |
          set -o pipefail
          DRIFT_FLAG_FILE="$(mktemp)"
          trap 'rm -f "$DRIFT_FLAG_FILE"' EXIT
          {
            echo '## ts-public-api drift report'
            echo
            echo '```diff'
            if ! diff -u packages/engine/etc/public-api.txt packages/engine/etc/public-api.txt.regen; then
              echo "1" > "$DRIFT_FLAG_FILE"
            fi
            echo '```'
            echo
            echo "If the diff is non-empty: review the change. If intentional"
            echo "(new public API export, type signature change), update the"
            echo "committed baseline in the same PR + flag the addition for"
            echo "manifest-review per V1-FROZEN-INTERFACE.md item 10 contract."
            echo "If unintentional, revert the source change."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s "$DRIFT_FLAG_FILE" ]; then
            echo "::error::ts-public-api drift detected. Update packages/engine/etc/public-api.txt baseline per the V1-FROZEN-INTERFACE item 10 freeze contract."
            exit 1
          fi
