name: cargo-public-api (API drift detector)

# Phase-3 G20-A3 wave-8a — cargo-public-api workflow per
# `.addl/phase-3/00-implementation-plan.md` §3 G20-A3 +
# `docs/future/phase-3-backlog.md` §7.3.A.9 (sub-cluster 9a). Replaces
# the Phase-2b R4-FP B-3 RED-PHASE STUB.
#
# Trigger discipline per METH-13: pull_request branches: [main] +
# push branches: [main]. workflow_dispatch added for ad-hoc baseline
# refresh runs. No `push: branches: ['**']`.
#
# Status (G-CORE-9 R1 fix-pass 2026-05-24; supersedes the Phase-2b
# ci-decisions-2026-04-22.md §4 informational-only posture per the
# G-CORE-9 R1 triage Fork 3 ratification): REQUIRED-FAILING. The freeze
# contract at V1-FROZEN-INTERFACE.md item 9 requires this gate to bite —
# informational-only means the freeze-doc contract has no required-CI-check
# backstop. Drift = fail; baseline-update is the explicit fix-path (and
# must accompany the PR that introduces the surface change).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cargo-public-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # §3.5o CI disk-OOM env discipline (codified 2026-05-22; sweep
  # applied workspace-wide at R6-FP-D 2026-05-24 per L19-r1-MAJ-1
  # close). Prevents `No space left on device` / `ld signal 7 SIGBUS`
  # under cargo compile/link pressure on GH Actions runners.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  cargo-public-api:
    name: API drift detector (required-failing per G-CORE-9 FREEZE)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0   # need full history for main..HEAD diff

      - name: Install Rust nightly (cargo-public-api requires nightly rustdoc-json)
        # SHA pin is the dtolnay/rust-toolchain action code; `toolchain: nightly`
        # below is what selects the actual nightly compiler. SHA is from the
        # `stable` branch head (Dependabot-rotated) — action code is branch-agnostic.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action SHA from stable; toolchain: nightly below
        with:
          toolchain: nightly

      - name: Install cargo-public-api (prebuilt)
        # taiki-e/install-action: ~3s for prebuilt cargo-public-api vs
        # ~120s for `cargo install --locked cargo-public-api` from
        # source. Pin to the action SHA + tool name; cargo-public-api
        # versioning is the tool's own.
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4 # v2
        with:
          tool: cargo-public-api

      - name: Diff public API surface against committed baselines (required-failing)
        # Per-crate diff: cargo-public-api emits the public surface in
        # text form; we compare against `docs/public-api/<crate>.txt`
        # baselines committed at G20-A3. Drift = workflow FAILS per
        # G-CORE-9 R1 triage Fork 3 ratification (was informational
        # pre-G-CORE-9; now required-failing per V1-FROZEN-INTERFACE
        # item 9 contract).
        shell: bash
        run: |
          set -o pipefail
          # G-CORE-9 R2 fix-pass (L9-r2-MAJ-1 + L12-R2-MAJ-1 Pattern β closure):
          # the previous DRIFT_DETECTED=1 assignment sat inside a `{ ... } | tee`
          # pipeline subshell, so the variable was lost in the parent shell and
          # `if [ "$DRIFT_DETECTED" -ne 0 ]` always evaluated false (workflow
          # passed even when drift was detected). The fix routes drift state
          # through a tempfile the parent shell reads after the pipeline completes.
          DRIFT_FLAG_FILE="$(mktemp)"
          trap 'rm -f "$DRIFT_FLAG_FILE"' EXIT
          {
            echo '## cargo-public-api drift report'
            echo
            # G-CORE-9 V1-FROZEN-INTERFACE row 1 (2026-05-23): 14 crates
            # cover the full v1-beta public surface; G-CORE-9 R1 Fork 3
            # (2026-05-24): drift = fail per V1-FROZEN-INTERFACE item 9.
            # F-full R5 (2026-06-05): + benten-membership-set (15th crate;
            # new this phase) joins the frozen-tracked surface.
            for crate in benten-core benten-errors benten-graph benten-caps benten-ivm benten-eval benten-engine benten-dsl-compiler benten-crypto-suite benten-drop benten-sync benten-id benten-membership-set benten-platform-foundation benten-renderer-tauri; do
              echo "### $crate"
              echo
              echo '```'
              # 2>/dev/null drops cargo status lines (Checking/Documenting/Finished)
              # which include absolute build-path strings that vary per checkout
              # (e.g. `/home/runner/work/...` vs local-dev `/Users/...`). Without
              # the suppression, baselines committed from a different environment
              # would false-positive on every CI run (R2-FP-1 fix-up 2026-05-24).
              if ! cargo +nightly public-api --simplified -p "$crate" 2>/dev/null | diff -u "docs/public-api/$crate.txt" -; then
                echo "1" > "$DRIFT_FLAG_FILE"
                echo
                echo "**DRIFT DETECTED for ${crate}** — update docs/public-api/${crate}.txt baseline as part of this PR per G-CORE-9 R1 Fork 3 ratification."
              fi
              echo '```'
              echo
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s "$DRIFT_FLAG_FILE" ]; then
            echo "::error::cargo-public-api drift detected. Update docs/public-api/<crate>.txt baselines per the freeze contract."
            exit 1
          fi
