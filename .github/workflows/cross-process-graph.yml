name: Cross-Process Graph CID

# Extends D2 (cross-process determinism of benten-core's CID) to
# benten-graph: write a Node in one process, read it in a second process,
# assert the CID survives the redb serialize -> deserialize roundtrip
# byte-identical.
#
# R3 ownership: rust-test-writer-performance. Referenced as the "cross-
# process determinism extension" in implementation plan §4.6.
#
# The actual integration test that implements this lives in
# `crates/benten-engine/tests/integration/cross_process_graph.rs`
# (owned by qa-expert-integration per R2 landscape). This workflow is
# the CI gate that runs it as a dedicated job so a failure here is
# attributable rather than getting lost in the main test output.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cross-process-graph-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # §3.5o CI disk-OOM env discipline (codified 2026-05-22; sweep
  # applied workspace-wide at R6-FP-D 2026-05-24 per L19-r1-MAJ-1
  # close). Prevents `No space left on device` / `ld signal 7 SIGBUS`
  # under cargo compile/link pressure on GH Actions runners.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  graph-cross-process:
    name: benten-graph cross-process CID roundtrip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2
        with:
          tool: cargo-nextest

      - name: Run cross-process graph integration test
        # `nextest` runs each integration test binary in its own process,
        # so writing in one #[test] and reading in another genuinely
        # exercises cross-process round-trip. If the test is split across
        # two processes (parent spawns child), the harness handles that.
        # Flag is fatal so a hang here doesn't wedge the whole workflow.
        #
        # The cross-process scenario lives at
        # `crates/benten-engine/tests/integration/cross_process_graph.rs`
        # and is compiled into the shared `integration` test binary (see
        # `tests/integration.rs`'s `mod integration` aggregator). Filter
        # by the module path so only that scenario runs here.
        timeout-minutes: 5
        run: |
          # NOTE: `-p benten-engine` scope — feature paths must be reachable
          # from benten-engine's direct deps. benten-drop/testing + benten-dev/testing
          # were stripped at PR #1351 R6 R1 FP consolidation (A's F1.c brief
          # extended workflows blindly; this workflow is package-scoped so
          # the workspace-wide feature list doesn't apply).
          cargo nextest run \
            --features benten-eval/testing,benten-engine/test-helpers,benten-caps/testing,benten-core/testing,benten-id/testing,benten-crypto-suite/testing,benten-ivm/testing,benten-platform-foundation/testing,benten-sync/testing \
            -p benten-engine \
            --test integration \
            'integration::cross_process_graph::'
