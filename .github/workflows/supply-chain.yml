name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly audit of the committed lockfile against the latest advisory DB.
    # Opens an issue when new advisories appear even if no PR is in flight.
    - cron: '0 12 * * 1'

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # §3.5o CI disk-OOM env discipline (codified 2026-05-22; sweep
  # applied workspace-wide at R6-FP-D 2026-05-24 per L19-r1-MAJ-1
  # close). Prevents `No space left on device` / `ld signal 7 SIGBUS`
  # under cargo compile/link pressure on GH Actions runners.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  cargo-deny:
    name: cargo-deny (licenses / bans / advisories / sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2
        with:
          command: check
          arguments: --all-features
          # `--allow wildcard` is a `check` subcommand option, so it goes in
          # `command-arguments` (post-subcommand), not `arguments`
          # (pre-subcommand). The cargo-deny-action composes the command line
          # as `cargo-deny {arguments} check {command-arguments}`.
          #
          # Downgrades the `bans.wildcards = "deny"` lint for path-only /
          # workspace-internal wildcard deps that cargo-deny flags because the
          # `path = ".."` form lacks a version field. Genuine wildcard
          # versions from crates.io still trip `deny` via other code paths;
          # this narrow allow applies only to workspace-internal path/git
          # forms. Clean resolution moves to `bans.allow-wildcard-paths = true`
          # in deny.toml once that file is next touched.
          command-arguments: --allow wildcard
          # Fail on any advisory with CVSS HIGH or CRITICAL. Medium/low
          # advisories surface as warnings. The deny.toml `yanked = "deny"`
          # setting catches yanked crates regardless of severity (which would
          # have caught the core2 event in real time).

  cargo-audit:
    name: cargo-audit (belt-and-suspenders)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        # Prebuilt binary via taiki-e install-action — ~3s instead of ~45s
        # for `cargo install --locked cargo-audit` (which compiles from
        # source).
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4 # v2
        with:
          tool: cargo-audit

      - name: Audit
        # Mirror deny.toml [advisories] ignore list — cargo-audit reads
        # its own config (not deny.toml). Closures tracked at:
        # - docs/future/phase-3-backlog.md §9 (iroh-version-bump cycle /
        #   Phase-7 Garden-relay alt) for Phase-3 cohort
        # - docs/future/phase-4-backlog.md §3.6 (Tauri 2.x upstream
        #   migration: gtk4-rs / proc-macro-error2 / urlpattern's unic-ucd
        #   successor) for Phase-4-Foundation cohort added at R6-FP-E
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0089 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0222 \
            --ignore RUSTSEC-2026-0247 \
            --ignore RUSTSEC-2026-0248 \
            --ignore RUSTSEC-2026-0251 \
            --ignore RUSTSEC-2026-0255 \
            --ignore RUSTSEC-2023-0126
            # ---- AUDIT-ONLY (deliberately NOT in deny.toml) ----
            # RUSTSEC-2023-0126 (`im` OrdSet aliasing violation) is `informational
            # = "unsound"`. cargo-audit DENIES the unsound class; cargo-deny's
            # version-2 default only WARNS on it. That asymmetry is the whole
            # point of this belt-and-suspenders lane — the two tools have
            # different policies and the stricter one is here. Listing this id in
            # deny.toml would only produce a permanent `advisory-not-detected`
            # warning, so the mirror is documented rather than literal; deny.toml
            # carries a comment pointing back here (§3.5g item 4).
            #
            # SUBSTANCE, stated plainly because "unsound" undersells it: inserting
            # into an `im::OrdSet` can violate Rust's aliasing rules — Miri reports
            # a stacked-borrows violation in `sized_chunks::Chunk::force_copy()`.
            # That is undefined behaviour reachable from safe code, category
            # memory-corruption. `patched = []` and bodil/im-rs was archived
            # 2026-05-03, so there is NO fix to take. It reaches us only through
            # loro's internal persistent collections (loro 1.12 -> loro-internal ->
            # im); Benten has no direct `im` usage and never constructs an OrdSet.
            # VERIFIED 2026-08-11: bumping to loro-internal 1.13.9 does NOT drop
            # `im`, so the upstream bump is not a closure path today — closure
            # needs loro to replace `im` outright. Tracked at phase-4-backlog §3.6.
            #
            # RUSTSEC-2026-0253 (`lru` use-after-free on panic in `pop()`) is NOT
            # listed: it was FIXED, not suppressed — `cargo update -p lru` took
            # 0.18.0 -> 0.18.2 (the patched release). Transitive via
            # iroh-relay 1.0.0-rc.0. A patch that exists gets taken.
            # RUSTSEC-2026-0222 (wasmtime store/type-index confusion between
            # engines, LOW): mirror of deny.toml. UNREACHABLE — benten-eval holds
            # ONE process-wide OnceLock<Engine> and has exactly one Engine::new
            # site; the advisory needs two engines. That premise is enforced by
            # crates/benten-eval/tests/exactly_one_wasmtime_engine_per_process.rs,
            # so this suppression cannot silently outlive its own justification.
            # No patch exists in the pinned 43.x line (fixes: >=46.0.2, >=36.0.13);
            # remediation is a 3-major runtime bump held off the freeze branch.
            # RUSTSEC-2026-0247 + -0248 + -0251 (bitmaps / im / sized-chunks
            # unmaintained, informational): one transitive cluster via
            # loro 1.12 -> loro-internal -> im; no direct Benten dependency;
            # closure requires an upstream loro release dropping `im`.
            # All four: closure tracked at phase-4-backlog.md §3.6.
            #
            # RUSTSEC-2026-0255 (`sized-chunks` panic-safety, informational =
            # "unsound") added 2026-08-12. AUDIT-ONLY for the same reason as
            # RUSTSEC-2023-0126: cargo-audit DENIES the unsound class and
            # cargo-deny only warns, so listing it in deny.toml would produce a
            # permanent advisory-not-detected warning. SUBSTANCE: `Chunk::clear`
            # / `drop_left` / `drop_right`, `InlineArray::clear` and
            # `RingBuffer::clear` / `drop_left` / `drop_right` drop elements
            # BEFORE updating the length metadata, so an element whose `Drop`
            # panics skips the metadata update and leaves already-dropped
            # elements recorded as live -- use-after-free / double-free,
            # reachable from safe Rust via `catch_unwind` with a panicking
            # element `Drop`. Affects <=0.7.0; NO patched version exists. Same
            # transitive path as -0126/-0247/-0248/-0251 (sized-chunks 0.6.5 <-
            # im 15.1.0 <- loro-internal 1.12 <- loro <- benten-sync); Benten
            # has no direct sized-chunks or im usage and constructs none of the
            # affected containers, and the trigger additionally requires an
            # element type whose Drop panics -- loro's internal element types,
            # not ours.
            #
            # ESCALATION, stated because the count now says something the
            # individual entries do not: this archived crate family is up to
            # FIVE advisories reached through one dependency (loro) -- two of
            # them `unsound` (memory-corruption class, -0126 and -0255) and
            # three `unmaintained`. None has a fix and none can get one:
            # bodil/im-rs was archived 2026-05-03. Suppression remains correct
            # per-advisory, but "wait for loro to drop `im`" is now carrying
            # five items with no upstream clock. Surfaced for Ben at
            # phase-4-backlog.md §3.6.
            # RUSTSEC-2026-0194 + RUSTSEC-2026-0195 (quick-xml DoS, HIGH 7.5):
            # mirror of deny.toml [advisories].ignore (§3.5g item 4 dual-config
            # mirror). quick-xml transitive via tauri 2.11 -> plist AND
            # iroh 1.0.0-rc.0 -> netdev -> plist; reached ONLY for local OS-plist
            # parsing (macOS Info.plist / interface enumeration), never
            # remote/untrusted XML. plist pins quick-xml ^0.39.2 so not bumpable
            # without upstream plist/tauri/iroh releases. Drop both when tauri/iroh
            # bump pulls plist onto quick-xml >=0.41.0. Closure: phase-4-backlog.md §3.6.
            # RUSTSEC-2026-0173 (proc-macro-error2 newly-flagged unmaintained,
            # informational; transitive via tauri/gtk-rs proc-macros) added 2026-06-07.
            # RUSTSEC-2026-0119 + RUSTSEC-2026-0120 (hickory-dns
            # CPU-exhaustion + NSEC3 unbounded-loop) CLOSED 2026-05-19 at
            # G-CORE-2-FP-1 via iroh 0.98 → 1.0.0-rc.0 bump (transitive
            # hickory-resolver 0.26.0-beta.4 → 0.26.1 picks up the upstream
            # fix). Ignore lines removed per L12-MAJ-3 (G-CORE-9 R1
            # fix-pass): cargo-audit will warn on advisory-not-detected
            # for stale ignores; this restores the dual-config mirror
            # discipline per §3.5g item 4.

  lockfile-verify:
    name: Cargo.lock integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Verify Cargo.lock is the fully-resolved source of truth
        # --locked fails if Cargo.lock would need to change. If it fails in
        # CI but not locally, the author forgot to commit an updated lock.
        run: cargo build --locked --workspace

  weekly-audit-issue:
    # Only runs on the scheduled weekly cron. Opens a GitHub issue when new
    # advisories land, so the dep watch doesn't rely on someone happening to
    # push a PR.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4 # v2
        with:
          tool: cargo-audit

      - name: Run audit and collect output
        id: audit
        run: |
          set +e
          cargo audit --json > audit-report.json 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Open tracking issue on new advisories
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.json', 'utf8');
            const body = `Weekly cargo-audit detected one or more advisories against the current committed lockfile.\n\n\`\`\`json\n${report}\n\`\`\`\n\nResponse protocol: see CONTRIBUTING.md "Supply chain" section.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[supply-chain] cargo-audit advisory detected (${new Date().toISOString().slice(0, 10)})`,
              body: body,
              labels: ['supply-chain', 'needs-triage']
            });
